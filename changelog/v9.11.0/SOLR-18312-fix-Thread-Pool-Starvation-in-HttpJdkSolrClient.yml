title: >
  Fix Thread Pool Starvation in HttpJdkSolrClient.
  HttpJdkSolrClient defaults would often create 32 threads, likely under-utilizing them. and it would cap threads to 256.
  Now it does neither by default but Executor customization (and other saturation controls) remain.
type: fixed
