# See https://github.com/apache/solr/blob/main/dev-docs/changelog.adoc

title: >
  `bin/solr start` now learns that the node has started from a state file written by Jetty,
  instead of by calling the node over HTTP. The wait no longer fails for a node that is not
  reachable on localhost, such as one with a TLS certificate issued for another host name, and on
  Windows it no longer waits for other Solr nodes on the same host.
type: fixed
