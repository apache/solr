  `systemClearPropertySolrEnableUrlAllowList()` methods (the latter was already a no-op). Use
  `System.setProperty(AllowListUrlChecker.ENABLE_URL_ALLOW_LIST, ...)` directly instead. This
  affects test code written against the `solr-test-framework` artifact.
