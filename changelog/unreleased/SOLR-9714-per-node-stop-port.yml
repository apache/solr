# See https://github.com/apache/solr/blob/main/dev-docs/changelog.adoc
title: >
  STOP_PORT can now be set per node. Stopping a node no longer assumes its stop port is
  (SOLR_PORT-1000), but reads the stop port of the node being stopped, so `bin/solr stop`,
  `stop -p PORT` and `stop --all` work on hosts where nodes were started with different
  STOP_PORT values.
type: fixed
authors:
