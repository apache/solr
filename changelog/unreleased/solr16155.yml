title: >
  Document field values are no longer included in indexing error messages, since they may leak
  sensitive data into logs and API responses. To aid debugging, enable TRACE level logging for
  org.apache.solr.update.DocumentBuilder or org.apache.solr.handler.loader.JavabinLoader
  to log the offending field values.
type: fixed
