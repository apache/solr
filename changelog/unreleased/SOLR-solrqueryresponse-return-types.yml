title: >
  SolrQueryResponse.getResponseHeader()/addResponseHeader() are now declared to return/accept
  SimpleOrderedMap<Object> instead of NamedList<Object>. External code compiled against the old
  signature will get a NoSuchMethodError at runtime and must recompile.
type: changed
