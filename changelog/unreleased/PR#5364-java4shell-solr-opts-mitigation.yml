# See https://github.com/apache/solr/blob/main/dev-docs/changelog.adoc
title: >
  Mitigate CVE-2026-114938 ("Java4Shell"), a JDK-level Base64 decoder RCE, until JDK vendors ship a
  patched build: -XX:-UseBASE64Intrinsics is now enabled by default in the Docker image, and
  documented as an opt-in commented-out setting in solr.in.sh/solr.in.cmd for other distributions
type: security # added, changed, fixed, deprecated, removed, dependency_update, security, other
authors:
  - name: Marc Byrd
