# See https://github.com/apache/solr/blob/main/dev-docs/changelog.adoc
title:
  The generated JS client's build (solr/webapp/js-client) now installs with --include=dev, so it no
  longer fails when the builder's environment has NODE_ENV=production set - npm would otherwise
  skip the devDependencies (Babel and its plugins) that the build's own "prepare" script needs.
type: fixed
authors:
