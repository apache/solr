title: >
  SolrJ clients now write request content via RequestWriter.ContentWriter; ContentStreams from
  the long-deprecated SolrRequest.getContentStreams and RequestWriter.getContentStreams are still
  honored. Deprecated ContentStreamUpdateRequest in favor of the new ContentWriterUpdateRequest,
  ConfigSetAdminRequest.Upload.setUploadStream in favor of setUploadContent, and
  ClientUtils.toContentStreams. Upload.setUploadFile no longer gunzips .gz files or guesses a
  missing content type, so pass the content type explicitly.
type: deprecated
