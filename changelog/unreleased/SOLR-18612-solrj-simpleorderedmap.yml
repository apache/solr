title: >
  SolrJ internals: where SolrJ builds a NamedList whose keys never repeat (Schema API request bodies,
  the client-side objects JsonMapResponseParser and QueryResponse.getFacetPivot() return, routed-update
  bookkeeping) it now creates a SimpleOrderedMap. Request bodies are byte-for-byte unchanged and Solr's
  responses are not touched; only the runtime type of these client-side objects changes.
type: changed
