title: >
  SolrCloud now supports FileSystemConfigSetService (configSetService in solr.xml), loading the ConfigSet
  named by the collection's configName from the local file system.  The Admin UI's "Files" view works with it too.
  Setting solr.configset.default.confdir to blank disables bootstrapping the _default ConfigSet.
type: added
authors:
  - name: David Smiley
links:
