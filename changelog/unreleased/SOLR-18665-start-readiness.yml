# See https://github.com/apache/solr/blob/main/dev-docs/changelog.adoc

title: >
  `bin/solr start` now waits for the node to be ready, instead of for its port to be listening, so a
  command that runs right after it no longer races the node's startup. A start that never completes
  now also exits non-zero.
type: fixed
