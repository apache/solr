title: The snapshot commands are now available as `bin/solr snapshot create`, `delete`, `describe`, `export` and `list` in the experimental picocli command line interface. The `snapshot-create` and the other `snapshot-*` spellings still work there, hidden and deprecated, and are removed in Solr 12.
