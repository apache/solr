title: >
  Experimental picocli CLI: every command now shares one set of `--solr-connection`, `--zk-host`
  and `--solr-url` options, so the `SOLR_CONNECTION`, `ZK_HOST` and `SOLR_URL` fallbacks reach all
  commands, an explicitly passed option always wins over them, and passing more than one of the
  three is rejected consistently.
type: changed
