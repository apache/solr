# See https://github.com/apache/solr/blob/main/dev-docs/changelog.adoc

title: >
  NamedList is now a sealed class whose only subclass is SimpleOrderedMap, which is final. Third-party
  code can no longer extend either. CloudSolrClient.RouteResponse is removed: a routed update now
  returns a plain SimpleOrderedMap whose responseHeader carries each route's achieved replication
  factor under "rfByRoute", which getShardReplicationFactor() reads.
type: changed
