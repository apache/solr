# See https://github.com/apache/solr/blob/main/dev-docs/changelog.adoc

title: >
  Solr now ships Prometheus alert rules in `solr/monitoring/prometheus-solr-alerts.yml`, covering
  heap usage, GC time, disk space, unreachable nodes, search latency, request error rate, Overseer
  queue buildup and index-to-memory ratio. The reference guide lists the rules and their thresholds.
type: added
