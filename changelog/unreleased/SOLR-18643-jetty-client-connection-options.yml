title: >
  Http2SolrClient.Builder can now set the maximum lifetime of pooled connections
  (withConnectionMaxDuration), the number of HTTP/2 connections per host (withMaxHttp2ConnectionsPerHost,
  previously fixed at 4) and an idle timeout for connections (withConnectionIdleTimeout).
type: added
