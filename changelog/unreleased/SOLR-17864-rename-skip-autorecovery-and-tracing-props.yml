title: >
  Renamed the system properties solrcloud.skip.autorecovery to
  test.solr.cloud.replica.autorecovery.skip.enabled, solr.traceHostName to solr.tracing.host.name, and
  solr.traceIdHeader to solr.tracing.always.on.header, to follow Solr's standard system property naming
  convention. The old names still work but are deprecated.
type: changed
