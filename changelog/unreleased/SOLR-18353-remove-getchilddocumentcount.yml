title: >
  Removed the deprecated `SolrDocumentBase.getChildDocumentCount()` method (and its `SolrDocument`/
  `SolrInputDocument` overrides). Use `getChildDocuments().size()` instead (null-check first, since
  `getChildDocuments()` may return `null` when there are no anonymous child documents).
