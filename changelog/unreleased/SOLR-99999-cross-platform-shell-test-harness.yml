# See https://github.com/apache/solr/blob/main/dev-docs/changelog.adoc

title: >
  New cross-platform test harness for the Solr CLI, in `org.apache.solr.shell`. One JUnit test
  source exercises `bin/solr` under bash and `bin\solr.cmd` under cmd.exe, so the start scripts are
  covered on Windows for the first time. The BATS suites in `solr/packaging/test` are ported to it
  and deprecated.
