# See https://github.com/apache/solr/blob/main/dev-docs/changelog.adoc
title: >
  The collection BACKUP API can no longer create backups in the deprecated non-incremental
  ("full-snapshot") format. The `incremental` parameter is removed from
  `/admin/collections?action=BACKUP` and from the v2 request body, along with the `commitName`
  parameter (v1) / `snapshotName` field (v2) that only that format read, and the SolrJ methods
  `CollectionAdminRequest.Backup.setIncremental(boolean)` (deprecated since 9.0) and
  `setCommitName(String)`. Restoring collections from existing non-incremental backups is
  unaffected. The core-level `/admin/cores?action=BACKUPCORE` API keeps its own `incremental` and
  `commitName` parameters.
type: removed
authors:
  - name: Serhiy Bzhezytskyy
