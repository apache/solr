title: Fix the eDisMax parser adding an empty phrase field (pf) boost clause when no phrase qualifies
  for the boost, such as for single-term queries or q=*:*, and an empty boost query (bq) clause when
  the bq consists only of stopwords. The empty SHOULD clauses did not affect scoring but defeated the
  single-clause MatchAllDocsQuery optimization; they are now omitted, so q=*:* reduces to a
  MatchAllDocsQuery even when pf or bq is set.
type: fixed
