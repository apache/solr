title: >
  The /export handler now supports document transformers (e.g. `[docid]`) and field aliases in `fl`,
  and their output is visible to its local streaming expression (`expr`). An aliased field such as
  `fl=x:myfield` is now returned as `x`; previously it was silently returned as `myfield`.
type: added
authors:
