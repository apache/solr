title: >
  Add opt-in useRawVectorsAsStored support for dense vector fields,
  allowing retrieval without duplicate stored-field storage when
  stored=false. Supports FLOAT32 and BYTE encodings, single-valued
  and multivalued fields, /select, RealTime Get, and preservation
  during atomic updates.
type: added
authors:
