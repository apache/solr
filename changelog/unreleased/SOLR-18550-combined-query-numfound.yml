title: >
  For combined queries, numFound is the distinct fused document count when numFoundExact
  is true, and otherwise a lower bound of at least the largest sub-query's match count,
  marked inexact when a sub-query list was truncated by the fusion pool (shards.rows,
  start + rows, or knn topK).
