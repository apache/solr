# See https://github.com/apache/solr/blob/main/dev-docs/changelog.adoc
title: bin/solr delete's -f/--force flag is deprecated and no longer has any effect. It was never
  actually able to force-delete a configset still in use by another collection -- the Overseer's
  configset-delete command unconditionally refuses that -- so it's kept only as a no-op for
  backward compatibility with existing scripts.
type: deprecated
