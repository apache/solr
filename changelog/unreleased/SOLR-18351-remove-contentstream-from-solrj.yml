title: >
  SolrJ clients now write request content only via RequestWriter.ContentWriter, no longer via the
  deprecated ContentStream. Deprecated ContentStreamUpdateRequest in favor of the new
  ContentWriterUpdateRequest, and ConfigSetAdminRequest.Upload.setUploadStream in favor of
  setUploadContent. ContentStream-based RequestWriter, SolrRequest and ClientUtils methods are
  deprecated and no longer used by SolrJ clients.
type: deprecated
