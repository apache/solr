title: >
  The metrics endpoints now answer HTTP 510 when metrics collection is disabled in solr.xml,
  on both the v1 and v2 API. The v1 API used to return HTTP 500, which made the Admin UI
  Plugins / Stats screen render blank. It now explains that metrics are disabled.
type: fixed
