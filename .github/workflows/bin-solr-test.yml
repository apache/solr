# DEPRECATED, and manual-only: the BATS suites it runs are deprecated as of Solr 10.2, and every
# .bats file has a ported counterpart under solr/packaging/src/test/org/apache/solr/shell run by
# cats-test.yml, which also covers bin/solr.cmd. This workflow goes away with the .bats files.
name: Solr Script Tests (BATS, deprecated)

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Solr Script Tests

    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - uses: ./.github/actions/prepare-for-build

    - name: Test the bin/solr script
      run: ./gradlew integrationTests

    # Reuses the distribution built above, so this only costs the curated suite run.
    - name: Test the bin/solr script with the experimental picocli CLI
      run: ./gradlew integrationTestsPicocli

    - name: Archive logs
      if: ${{ failure() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: logs
        path: |
          solr/packaging/build/test-output
          solr/packaging/build/test-output-picocli
