name: Validate Changelog

on:
  pull_request:
    # 'labeled'/'unlabeled' re-run this check when a human toggles 'no-changelog';
    # the comment command re-runs it explicitly, see changelog-comment-command.yml.
    types:
      - opened
      - reopened
      - synchronize
      - labeled
      - unlabeled
    branches:
      - '*'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  validate-changelog:
    name: Check changelog entry
    # Renovate PRs (solrbot) are summarized at release time, and of the label
    # events only 'no-changelog' is of interest here.
    if: |
      github.event.pull_request.user.login != 'solrbot' &&
      (
        (github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
        github.event.label.name == 'no-changelog'
      )
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: read         # the PR's labels
      pull-requests: read  # the PR's changed files

    # This job runs no PR code: it reads the PR through the API, keeps that data
    # outside the workspace, and only runs the validator from the base commit.
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}

    steps:
    - name: Check for no-changelog label
      id: check-label
      run: |
        set -euo pipefail
        # Not github.event.pull_request.labels: a re-run replays the original payload.
        has_label=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/labels" \
          --jq '[.[].name] | index("no-changelog") != null')
        if [ "$has_label" = "true" ]; then
          echo "::notice::PR#${PR_NUMBER} has the 'no-changelog' label; skipping validation"
        fi
        echo "skip=${has_label}" >> "$GITHUB_OUTPUT"

    - name: Check for changelog entry
      id: entry
      if: steps.check-label.outputs.skip == 'false'
      run: |
        set -euo pipefail
        files="$RUNNER_TEMP/pr-files.tsv"
        entries="$RUNNER_TEMP/entry-paths.txt"

        gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/files" \
          --jq '.[] | [.status, .filename] | @tsv' > "$files"

        # Entries that are still there to validate; a deleted one has nothing to read.
        awk -F'\t' '$1 != "removed" && $2 ~ /^changelog\/unreleased\/.+\.ya?ml$/ { print $2 }' \
          "$files" > "$entries"

        if [ -s "$entries" ]; then
          echo "✓ Changelog entry found"
          echo "validate=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # Docs, tests, build files and CI config need no entry.
        if ! cut -f2 "$files" | grep -qvE "(^changelog/|^solr/solr-ref-guide/|^dev-docs/|^\.github/|\.md$|\.adoc$|^solr/.*/test|\.gradle$|\.properties$|README|NOTICE|LICENSE)"; then
          echo "✓ No code changes detected (docs/tests only)"
          exit 0
        fi

        echo "::error::This PR appears to contain code changes but no changelog entry was added."
        echo ""
        echo "Please add a changelog entry by:"
        echo "1. Running: ./gradlew writeChangelog"
        echo "2. Editing the generated YAML file in changelog/unreleased/"
        echo "3. Committing the YAML file"
        echo ""
        echo "For more information, see: dev-docs/changelog.adoc"
        echo ""
        echo "If this PR should not have a changelog entry (e.g., refactoring, internal cleanup),"
        echo "comment '/no-changelog' on the PR (or add the 'no-changelog' label)."
        echo "This check then re-runs automatically. To undo, comment '/needs-changelog'."
        exit 1

    # Only the validator script, only from the base commit, only one commit deep.
    - name: Checkout the validator
      if: steps.entry.outputs.validate == 'true'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.event.pull_request.base.sha }}
        sparse-checkout: dev-tools/scripts
        fetch-depth: 1
        persist-credentials: false

    - name: Validate changelog YAML structure
      if: steps.entry.outputs.validate == 'true'
      run: |
        set -euo pipefail
        entries="$RUNNER_TEMP/entry-paths.txt"
        yamls="$RUNNER_TEMP/entries"
        mkdir -p "$yamls"

        # PR-authored data: fetched outside the workspace and only ever parsed.
        while IFS= read -r file; do
          echo "Fetching $file"
          gh api -H "Accept: application/vnd.github.raw" \
            "repos/${REPO}/contents/${file}?ref=${HEAD_SHA}" > "${yamls}/$(basename "$file")"
        done < "$entries"

        python3 dev-tools/scripts/validate-changelog-yaml.py "$yamls" \
          || { echo "Please see dev-docs/changelog.adoc for more info."; exit 1; }
