name: Ops Modules Tests

on:
  pull_request:
    branches:
      - '*'
    paths:
      - '.github/workflows/tests-modules-ops.yml'
      - 'gradle/libs.versions.toml'
      - 'solr/cross-dc-manager/**'
      - 'solr/modules/cross-dc/**'
      - 'solr/modules/gcs-repository/**'
      - 'solr/modules/jwt-auth/**'
      - 'solr/modules/opentelemetry/**'
      - 'solr/modules/s3-repository/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Ops Modules Tests

    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - uses: ./.github/actions/prepare-for-build

    - name: Test the ops and infrastructure modules
      run: >
        ./gradlew
        :solr:cross-dc-manager:test
        :solr:modules:cross-dc:test
        :solr:modules:gcs-repository:test
        :solr:modules:jwt-auth:test
        :solr:modules:opentelemetry:test
        :solr:modules:s3-repository:test

    - name: Archive test output
      if: ${{ failure() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: test-output-modules-ops
        path: |
          solr/cross-dc-manager/build/test-results/**
          solr/modules/*/build/test-results/**
