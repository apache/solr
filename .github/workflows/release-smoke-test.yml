name: Release Smoke Script Tests

on:
  pull_request:
    paths:
      - '.github/workflows/release-smoke-test.yml'
      - 'dev-tools/scripts/smokeTestRelease.py'
      - 'dev-tools/scripts/scriptutil.py'
      - 'dev-tools/scripts/tests/test_smoke_release_slim.py'

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test release smoke script
        run: python3 -m unittest discover -s dev-tools/scripts/tests -p test_smoke_release_slim.py -v
