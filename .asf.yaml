# https://github.com/apache/infrastructure-asfyaml/blob/main/README.md

github:
  description: "Apache Solr open-source search software"
  homepage: https://solr.apache.org/
  labels:
    - lucene
    - solr
    - search
    - nosql
    - java
    - backend
    - search-engine
    - information-retrieval

  enabled_merge_buttons:
    squash: true
    merge:  false
    rebase: false

  # Cap how many pull requests a contributor without write access may have open at once.
  # See https://github.com/apache/infrastructure-asfyaml#pr_creation_cap
  pull_requests:
    del_branch_on_merge: true
    creation_cap:
      enabled: true
      max_open_pull_requests: 7
      # This feature not yet supported in prod, enable once it is live
      # See https://the-asf.slack.com/archives/CBX4TSBQ8/p1792688456355089 for status
      #include_drafts: true

  # TODO: Add to this list for each new minor release
  protected_branches:
    main: {}
    branch_10x: {}
    branch_10_0: {}
    branch_10_1: {}
    branch_9_0: {}
    branch_9_1: {}
    branch_9_2: {}
    branch_9_3: {}
    branch_9_4: {}
    branch_9_5: {}
    branch_9_6: {}
    branch_9_7: {}
    branch_9_8: {}
    branch_9_9: {}
    branch_9_10: {}
    branch_9_11: {}
    branch_9x: {}

  protected_tags:
    - "releases/*"

  autolink_jira:
    - SOLR

  collaborators:
    - solrbot

  # We use Renovate (solrbot) as our sole dependency-update bot; Dependabot's version/security
  # update PRs duplicate what Renovate already opens (e.g. #4737 duplicating #4590). Keep
  # dependabot_alerts on for Security-tab vulnerability visibility.
  dependabot_alerts: true
  dependabot_updates: false

notifications:
  commits:      commits@solr.apache.org
  issues:       issues@solr.apache.org
  pullrequests: issues@solr.apache.org
  jira_options: link label worklog
