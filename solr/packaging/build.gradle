import org.apache.tools.ant.filters.ReplaceTokens
import org.apache.tools.ant.util.TeeOutputStream

// This project puts together a "distribution", assembling dependencies from
// various other projects.

plugins {
  id 'base'
  id 'distribution'
  // Only for the CATS suites under src/test; this project ships no Java of its own.
  id 'java'
}

description = 'Solr distribution packaging'

ext {
  distDir = file("$buildDir/solr-${version}")
  slimDistDir = file("$buildDir/solr-${version}-slim")
  devDir = file("$buildDir/dev")
  slimDevDir = file("$buildDir/dev-slim")
  batsLibsDir = file("$buildDir/bats-libs")
  onlineDocUnavailable = "Not available for custom/SNAPSHOT builds -- run './gradlew documentation' from the source distribution to build docs locally."
  onlineDocUrl = (project.solrDocUrl ? "${project.solrDocUrl}/" : onlineDocUnavailable).toString()
  onlineChangesUrl = (project.solrDocUrl ? "${project.solrDocUrl}/changes/Changes.html" : onlineDocUnavailable).toString()
}

configurations {
  modules
  example
  crossDcManager
  server
  docker
  solrFullTgz
  solrSlimTgz
  solrFullTgzSignature
  solrSlimTgzSignature
}

dependencies {
  rootProject.project(":solr:modules").childProjects.values().stream().map {project -> project.path}.each {
    module -> modules project(path: module, configuration: "packaging")
  }

  crossDcManager project(path: ":solr:cross-dc-manager", configuration: "packaging")

  example project(path: ":solr:example", configuration: "packaging")
  server project(path: ":solr:server", configuration: "packaging")

  docker project(path: ':solr:docker', configuration: 'packaging')

  // The CATS harness lives in solr/test-framework; the suites that use it live here, next to
  // the BATS tests they are ported from.
  testImplementation project(':solr:test-framework')
  testImplementation libs.junit.junit
  // For suites whose BATS original ran a 'docker run' by hand: a Testcontainers @ClassRule starts
  // the container once per class, maps a free port and skips when Docker is absent.
  testImplementation libs.testcontainers

  solrFullTgzSignature files("$buildDir/distributions/solr-${version}.tgz.asc") {
    builtBy ":solr:distribution:signFullBinaryTgz"
  }

  solrSlimTgzSignature files("$buildDir/distributions/solr-${version}-slim.tgz.asc") {
    builtBy ":solr:distribution:signSlimBinaryTgz"
  }
}

distributions {
  slim {
    distributionBaseName = 'solr'
    distributionClassifier = "slim"
    contents {

      from(rootDir, {
        include "LICENSE.txt"
        include "NOTICE.txt"
        include "CHANGELOG.md"
      })

      from(project(":solr").projectDir, {
        include "bin/**"
        include "licenses/**"
        exclude "licenses/README.committers.txt"
      })

      from(projectDir, {
        include "README.txt"
        filter(ReplaceTokens, tokens: [
            SOLR_DOC_URL: onlineDocUrl,
            SOLR_CHANGES_URL: onlineChangesUrl,
        ])
      })

      from('static/lib', {
        into 'lib'
      })

      from(configurations.server, {
        into "server"
      })

      from(configurations.docker, {
        into "docker"
        filesMatching([
            "scripts/**",
        ]) {copy ->
          copy.permissions { unix("0755") }
        }
      })

      // Manually correct posix permissions (matters when packaging on Windows).
      filesMatching([
          "**/*.sh",
          "**/bin/solr",
          "**/bin/systemd/solr.service",
      ]) {copy ->
        copy.permissions { unix("0755") }
      }

    }
  }
  full {
    distributionBaseName = 'solr'
    contents {
      // Build on-top of the slim distribution
      with(distributions.slim.getContents())

      from(configurations.example, {
        into "example"
      })

      from(configurations.modules, {
        into "modules"
      })

      from(configurations.crossDcManager, {
        into "cross-dc-manager"
        filesMatching([
            "bin/*",
        ]) {copy ->
          copy.permissions { unix("0755") }
        }
      })
    }
  }
}

installFullDist {
  into distDir
}

installSlimDist {
  into slimDistDir
}

assembleDist {
  dependsOn tasks.assembleFullDist
  dependsOn tasks.assembleSlimDist
}

installDist {
  dependsOn tasks.installFullDist
  dependsOn tasks.installSlimDist
}

task devFull(type: Copy) {
  description "Assemble Full Solr distribution into 'development' folder at ${devDir}"
  group "build"

  from installFullDist.outputs
  into devDir
}

task devSlim(type: Copy) {
  description "Assemble Slim Solr distribution into 'development' folder at ${slimDevDir}"
  group "build"

  from installSlimDist.outputs
  into slimDevDir
}

task dev {
  description "Assemble Solr distributions into 'development' folders at ${devDir} and ${slimDevDir}"
  group "build"

  dependsOn tasks.devFull
  dependsOn tasks.devSlim
}

fullDistTar {
  compression = Compression.GZIP
}

slimDistTar {
  compression = Compression.GZIP
}

distTar.dependsOn tasks.fullDistTar
distTar.dependsOn tasks.slimDistTar

fullDistZip.enabled = false
slimDistZip.enabled = false

assemble.dependsOn tasks.installDist
assemble.dependsOn tasks.installSlimDist

artifacts {
  solrFullTgz(fullDistTar)
  solrSlimTgz(slimDistTar)
}

tasks.register('runDev', JavaExec) {
  group = 'application'
  description = 'Starts Solr for local experimentation.  Does NOT use the bin/solr script.'
  dependsOn 'devSlim'

  workingDir = file("$slimDevDir/server")

  // Intentionally not synchronizing the logic here with bin/solr; don't want the burden

  doFirst {
    println "To attach a debugger, at the CLI pass: --debug-jvm"
    println "To pass JVM args, at the CLI pass: -PjvmArgs='--add-modules jdk.incubator.vector'"
    println "To pass system properties, at the CLI pass: -Dsolr.port.listen=8983"
  }

  maxHeapSize = project.findProperty('maxHeapSize') ?: '1G'

  jvmArgs = [] // don't use defaults from our build that assume this is a typical build task
  jvmArgs((project.findProperty('jvmArgs') ?: '').split())

  systemProperty 'solr.host.advertise', '127.0.0.1'
  systemProperty 'solr.port.listen', '8983'
  systemProperty 'solr.install.dir', file("$workingDir/..")
  systemProperty 'solr.logs.dir', file("$workingDir/logs")
  systemProperty 'solr.zookeeper.server.enabled', 'true' // SolrCloud; embedded ZK

  // Propagate CLI system properties (override defaults above)
  systemProperties += gradle.startParameter.systemPropertiesArgs

  classpath = files("$workingDir/start.jar")

  args((project.findProperty('args') ?: '--module=http').split())
}

tasks.register('downloadBats') {
  group = 'Build Dependency Download'
  description =
      'Downloads BATS and its helper libraries (bats-support, bats-assert, bats-file) used by integrationTests'

  def batsLibs = [
      [org: 'bats-core', repo: 'bats-core', version: libs.versions.bats.core.get()],
      [org: 'ztombol', repo: 'bats-support', version: libs.versions.bats.support.get()],
      [org: 'bats-core', repo: 'bats-assert', version: libs.versions.bats.assert.get()],
      [org: 'bats-core', repo: 'bats-file', version: libs.versions.bats.file.get()],
  ]
  def downloadDir = file("$buildDir/bats-downloads")

  inputs.property('batsLibs', batsLibs)
  outputs.dir(batsLibsDir)

  doLast {
    delete batsLibsDir
    mkdir downloadDir
    batsLibs.each {lib ->
      def archiveUrl = "https://github.com/${lib.org}/${lib.repo}/archive/refs/tags/v${lib.version}.tar.gz"
      def archiveFile = new File(downloadDir, "${lib.repo}-${lib.version}.tar.gz")
      ant.get(src: archiveUrl, dest: archiveFile, skipexisting: true)
      copy {
        from(tarTree(resources.gzip(archiveFile))) {
          // Strip the leading "<repo>-<version>/" directory that GitHub's archive adds.
          eachFile {details -> details.path = details.path.substring(details.path.indexOf('/') + 1)}
          includeEmptyDirs = false
        }
        into "$batsLibsDir/${lib.repo}"
      }
    }
  }
}

// Shared configuration for the BATS suites. outputName keeps each suite's Solr home, logs and
// reports apart; usePicocli selects the experimental CLI implementation for the run.
def configureBatsTask(BatsTask task, String outputName, boolean usePicocli) {
  task.dependsOn installFullDist
  task.dependsOn downloadBats

  def integrationTestOutput = "$buildDir/$outputName"
  def solrHome = "$integrationTestOutput/solr-home"
  def solrTestFailuresDir = "$integrationTestOutput/failure-snapshots"
  var solrPort = Integer
      .parseInt((String) project.findProperty('bats.port') ?: System.getProperty("bats.port", "-1"))
  while (solrPort > 64000 || solrPort < 0) { // We need room for +1000 for ZK
    try (ServerSocket s = new ServerSocket(0)) {
      solrPort = s.getLocalPort()
    } catch (Exception e) {
      println("WARN: Could not assign random port for Bats tests. Using default port 8983.")
      solrPort = 8983
    }
  }

  if (!Boolean.parseBoolean((String) project.findProperty('solr.bats.nightly'))) {
    task.filterTags = '!nightly'
  }

  task.reportDir = integrationTestOutput
  task.inputs.dir(distDir)
  task.inputs.dir('test')  // Track .bats test files and helper as inputs
  task.outputs.dir(integrationTestOutput)

  task.doFirst {
    delete integrationTestOutput
    mkdir integrationTestOutput
    mkdir solrHome
    mkdir solrTestFailuresDir

    // TODO - if quiet then don't tee
    task.standardOutput = new TeeOutputStream(System.out,
        new FileOutputStream("$integrationTestOutput/test-output.txt"))
    println("Running BATS tests with Solr base port ${solrPort}")
  }

  task.environment SOLR_TIP: distDir.toString()
  task.environment SOLR_HOME: solrHome
  task.environment SOLR_PID_DIR: solrHome
  task.environment SOLR_PORT_LISTEN: solrPort
  task.environment SOLR_PORT: solrPort
  task.environment SOLR2_PORT: solrPort + 1
  task.environment SOLR3_PORT: solrPort + 2
  task.environment ZK_PORT: solrPort + 1000
  task.environment SOLR_LOGS_DIR: "$solrHome/logs"
  task.environment TEST_OUTPUT_DIR: integrationTestOutput
  task.environment TEST_FAILURE_DIR: solrTestFailuresDir
  task.environment BATS_LIB_PREFIX: batsLibsDir
  if (usePicocli) {
    task.environment SOLR_PICOCLI: 'true'
  }
}

// CATS - Cross-platform Automated Testing System - the CLI suites built on the
// org.apache.solr.shell harness in solr/test-framework. Like the BATS suites these need the
// unpacked distribution, so they are not part of 'check' and the stock 'test' task is turned off.
tasks.named('test') {
  enabled = false
}

// Shared configuration for the CATS suites, mirroring configureBatsTask. outputName keeps
// each variant's SOLR_HOMEs, port-block counter and failure snapshots apart; picocli selects the
// CLI implementation, or null to take whatever bin/solr defaults to.
def configureCatsTestTask(Test task, String outputName, String picocli) {
  task.dependsOn installFullDist

  task.testClassesDirs = sourceSets.test.output.classesDirs
  task.classpath = sourceSets.test.runtimeClasspath

  // RollingUpgradeTest upgrades onto a Docker image built from this working tree, which only
  // catsTestsDockerBuild arranges; no other suite run should need Docker or the network, so it is
  // excluded here for all of them. catsTestsDockerBuild clears this again.
  task.filter.excludeTestsMatching 'org.apache.solr.shell.RollingUpgradeTest'

  // Unlike BATS, which runs every file sequentially against one shared SOLR_HOME and port block,
  // each class here gets its own of both (see HarnessEnv.forClass), so classes can run in parallel.
  // Defaults to the build's own tests.jvms, capped because the ceiling here is memory rather than
  // CPU: every fork may hold a Solr JVM plus embedded ZooKeeper. Override with -Pcats.tests.jvms.
  // (availableProcessors() is not usable: the Gradle daemon runs with -XX:ActiveProcessorCount=1.)
  //
  task.maxParallelForks = (project.findProperty('cats.tests.jvms')
      ?: Math.min(4, resolvedTestOption('tests.jvms') as Integer)) as Integer
  task.timeout.set(java.time.Duration.ofMinutes(60))

  def catsTestOutput = file("$buildDir/$outputName")
  task.inputs.dir(distDir)
  task.environment SOLR_TIP: distDir.toString()
  task.environment TEST_OUTPUT_DIR: catsTestOutput.toString()
  if (picocli != null) {
    task.environment SOLR_PICOCLI: picocli
  }

  task.doFirst {
    // Nodes left behind by a run that was killed outright are reaped by the harness itself, in
    // SolrShellTestCase's pre-flight check: it matches on the command-line marker, which works on
    // both platforms and needs no files. Doing it here instead would mean reading pid files, which
    // bin/solr and bin/solr.cmd disagree about, or reading process command lines, which the Gradle
    // daemon cannot do on Windows.
    //
    // Wiped per run, not per fork, so the port-block counter starts at zero and last run's
    // failure snapshots do not pile up. Matches what configureBatsTask does for the BATS output.
    delete catsTestOutput
    catsTestOutput.mkdirs()
    // The harness spawns bin/solr and writes outside the test sandbox, neither of which the test
    // security policy allows. Dropping the property is enough; nothing installs an SM later.
    task.systemProperties.remove('java.security.manager')
    logger.lifecycle("Running CATS with ${task.maxParallelForks} parallel fork(s)")
  }

  // BATS printed a line per test as it ran. Gradle buffers each fork's output and prints nothing
  // but failures, so a CATS run looks hung for minutes at a time. Suites here are few and slow
  // enough that one line each is a progress bar rather than noise. The class name is included
  // because forks interleave, and skips are shown because most of them mean a missing Docker.
  def marks = [SUCCESS: 'ok  ', SKIPPED: 'skip', FAILURE: 'FAIL']
  task.afterTest { desc, result ->
    // Locale.ROOT, or the decimal separator follows the randomized test locale ("0,9s" on nb-NO).
    task.logger.lifecycle(String.format(Locale.ROOT, "%s %s.%s (%.1fs)",
        marks[result.resultType.name()] ?: result.resultType.name(),
        desc.className.substring(desc.className.lastIndexOf('.') + 1),
        desc.name,
        (result.endTime - result.startTime) / 1000.0d))
  }
}

tasks.register('catsTests', Test) {
  group = 'verification'
  description = 'Runs the CATS bin/solr CLI suites against the unpacked distribution.'
  configureCatsTestTask(it, 'cats-test-output', null)
}

tasks.register('catsTestsPicocli', Test) {
  group = 'verification'
  description = 'Runs the CATS suites against the experimental picocli CLI.'
  configureCatsTestTask(it, 'cats-test-output-picocli', 'true')
}

// Deprecated: delete along with commons-cli itself, once picocli is the only CLI in Solr 11. Until
// then the two differ in some usage and error wording, so it is worth being able to run the suites
// against whichever bin/solr is not defaulting to. A test that genuinely cannot hold for both
// carries @EnabledOnCli; where only the wording differs, a test uses assertContainsForCli.
tasks.register('catsTestsCommonsCli', Test) {
  group = 'verification'
  description = 'Deprecated. Runs the CATS suites against the commons-cli implementation.'
  configureCatsTestTask(it, 'cats-test-output-commons-cli', 'false')
}

// Builds a Solr Docker image from this working tree and points RollingUpgradeTest at it, for the
// two tasks that run that suite. Onto an image from the tree rather than whatever
// apache/solr:<version> happens to be tagged on the machine - the property a release candidate
// needs. Every Docker dependency sits on these two tasks and not in configureCatsTestTask, so a
// plain catsTests run still neither needs Docker nor touches the network.
def configureCatsDockerImage = { Test task ->
  // dockerBuild rather than dockerTag, which would move apache/solr:<version> - a name a developer
  // may be deliberately keeping on the official image. The id dockerBuild writes is tagged in
  // doFirst instead, under a name with no org/repo shape so that nothing, Testcontainers included,
  // can mistake it for something to fetch from a registry.
  task.dependsOn ':solr:docker:dockerBuild'
  // gitRev and gitRevShort are set by that task's action, not at configuration time.
  task.dependsOn ':gitStatus'
  def imageIdFile = project(':solr:docker').layout.buildDirectory.file('image-id')
  def imageVersion = project.version.toString()

  task.doFirst {
    // Outside a checkout gitRevShort reads "(not a git checkout)", and on an IntelliJ import it can
    // be missing altogether; anything that is not a hex revision leaves the bare version.
    def rev = rootProject.hasProperty('gitRevShort') ? rootProject.gitRevShort as String : ''
    def image = 'solr-rolling-upgrade:' + imageVersion + (rev ==~ /[0-9a-f]+/ ? '-' + rev : '')
    def imageId = imageIdFile.get().asFile.text.trim()

    def tagging = new ProcessBuilder('docker', 'tag', imageId, image)
        .redirectErrorStream(true)
        .start()
    def taggingOutput = tagging.inputStream.text
    if (tagging.waitFor() != 0) {
      throw new GradleException("docker tag $imageId $image failed: $taggingOutput")
    }
    logger.lifecycle("Rolling upgrade will end on $image (image id $imageId)")

    // The variable RollingUpgradeTest already reads for the image to upgrade to.
    task.environment('SOLR_END_IMAGE', image)
  }
}

// Just the rolling upgrade, for iterating on that one suite.
tasks.register('catsTestsDockerBuild', Test) {
  group = 'verification'
  description =
      'Slow. Builds the Solr Docker image from this working tree, then rolling-upgrades onto it.'

  configureCatsTestTask(it, 'cats-test-output-docker-build', null)

  // An exclude beats an include in Gradle's filter, so the one configureCatsTestTask adds has to
  // go before this class can be selected at all.
  filter.excludePatterns = []
  filter.includeTestsMatching 'org.apache.solr.shell.RollingUpgradeTest'

  configureCatsDockerImage(it)
}

// Everything, in one command, in parallel. One Test task rather than a task depending on the two
// others: Gradle runs tasks within a project sequentially, so an aggregate would have run the
// rolling upgrade after the rest rather than alongside it. Here all 29 classes go into the same
// fork pool, so the upgrade runs concurrently with the CLI suites.
//
// Not the default, because it builds a Docker image. Note it is the heaviest thing in the build:
// the upgrade holds three containers while four forks may each hold a Solr JVM and an embedded
// ZooKeeper, so lower -Pcats.tests.jvms if the machine struggles.
tasks.register('catsTestsAll', Test) {
  group = 'verification'
  description = 'Slow. Every CATS suite including the rolling upgrade, which builds a Docker image.'

  configureCatsTestTask(it, 'cats-test-output-all', null)

  // No include filter, so clearing the exclude leaves every suite selected.
  filter.excludePatterns = []

  configureCatsDockerImage(it)
}

task integrationTests(type: BatsTask) {
  configureBatsTask(it, 'test-output', false)
}

task integrationTestsPicocli(type: BatsTask) {
  description = 'Runs the BATS suites for the migrated commands against the experimental picocli CLI.'
  configureBatsTask(it, 'test-output-picocli', true)
}

abstract class BatsTask extends Exec {
  // Note: testDir is marked @Internal because it's a String configuration property, not a trackable input.
  // The task using BatsTask should explicitly declare inputs.dir(testDir) in its configuration.
  @Internal
  String testDir = 'test'

  @Input
  var testFiles = []

  @Input
  @Optional
  String filterTags = null

  /** Where to write the junit report. Defaults to the project's test-output directory. */
  @Internal
  String reportDir = null

  @Option(option = "tests", description = "Sets test cases to be included")
  public void setTestNamePatterns(List<String> tests) {
    // TODO: bats --filter <regex>
    tests.each {testFiles << "$testDir/$it"}
  }

  @Override
  @TaskAction
  protected void exec() {
    executable "$project.ext.batsLibsDir/bats-core/bin/bats"

    def batsArgs = []
    if (logger.isInfoEnabled()) {
      batsArgs << '--verbose-run'
    }
    if (filterTags) {
      batsArgs += ['--filter-tags', filterTags]
    }
    batsArgs += ['-T', '--print-output-on-failure', '--report-formatter', 'junit', '--output', reportDir ?: "$project.buildDir/test-output"]
    // Note: tests to run must be listed after all other arguments
    batsArgs += testFiles.empty ? [testDir] : testFiles
    setArgs(batsArgs)
    super.exec()
  }
}

tasks.matching { it.name in ['assembleDist', 'releaseArtifacts'] }.configureEach {
  doFirst {
    def flagIsTrue = project.hasProperty('solr.ui.buildFromSource') &&
        project.property('solr.ui.buildFromSource') == 'true'
    if (!flagIsTrue) {
      throw new GradleException(
          "Release builds must set -Psolr.ui.buildFromSource=true so the Admin UI is " +
              "built from the voted source tree, not pulled from nightlies.apache.org."
      )
    }
  }
}
