import groovy.json.JsonOutput
import javax.inject.Inject
import org.gradle.process.ExecOperations
import org.apache.tools.ant.util.TeeOutputStream

apply plugin: 'java'
apply plugin: libs.plugins.nodegradle.node.get().pluginId

description = 'Solr Reference Guide'

/*
 Antora Logic - Building the ref-guide
 */

def officialSiteIncludePrerelease = propertyOrEnvOrDefault(
    "refguide.official.includePrereleaseVersions",
    "SOLR_REF_GUIDE_OFFICIAL_INCLUDE_PRERELEASE",
    "false").toBoolean()

def buildLocalUI = propertyOrEnvOrDefault("refguide.buildLocalUI",
    "SOLR_REF_GUIDE_BUILD_LOCAL_UI",
    "false").toBoolean()
def isBranchReleased = propertyOrEnvOrDefault("refguide.isBranchReleased",
    "SOLR_REF_GUIDE_IS_BRANCH_RELEASED",
    "false").toBoolean()

// This escapes strings inside YAML templates
// WARNING: Strings in YAML must use single quotes for this to work correctly!
// Double quotes in YAML can't be used as this requires more complicated
// escaping, see spec: https://yaml.org/spec/1.2.2/#732-single-quoted-style
def escapeYamlSingleQuotesString(props) {
  return props.collectEntries {k, v -> [k, v.toString().replace("'", "''")]}
}

// Attach building the ref guide to standard convention tasks. This
// can be optionally turned off (see SOLR-15670).
var defaultRefGuideInclude = file("${rootDir}/.git").exists()
if (propertyOrEnvOrDefault('refguide.include',
    'SOLR_REF_GUIDE_INCLUDE',
    "${defaultRefGuideInclude}").toBoolean()) {
  check.dependsOn 'checkSiteLinks'
  check.dependsOn 'checkCliDocsUpToDate'
  assemble.dependsOn 'buildLocalSite'
}

configurations {
  refGuide
  officialPlaybook
  localPlaybook
  localJavadocs
  cliClasspath {
    canBeResolved = true
    canBeConsumed = false
  }
}

dependencies {
  localJavadocs project(path: ":solr:documentation", configuration: 'javadocs')
  localJavadocs project(path: ":solr:documentation", configuration: 'site')
  cliClasspath project(path: ':solr:core', configuration: 'cliDocsRuntime')
}

ext {
  siteDir = "${buildDir}/site"
  antoraConfigBuildDir = "${buildDir}/antora-config"
  playbooksDir = "${project.ext.antoraConfigBuildDir}/playbooks"
  localAntoraYaml = "${project.ext.antoraConfigBuildDir}/antora.yml"
  siteStagingDir = "${buildDir}/site-staging"
  uiBuildDir = "${buildDir}/ui"
  playbookTemplate = "playbook.template.yml"
  localPlaybook = "local-playbook.yml"
  officialPlaybook = "official-playbook.yml"
}

/*
    Generating the Antora and Playbook YAML files
 */
task buildLocalAntoraYaml {
  group = 'Site - Local'
  description "Creates a local antora.yml with all variables populated."

  def templateYaml = "antora.template.yml"

  inputs.file(templateYaml)
  outputs.file(project.ext.localAntoraYaml)

  def splitVersion = version.toString().split("\\p{Punct}")
  def displayVersion = "${splitVersion[0]}.${splitVersion[1]}"
  def prerelease = false
  if (!isBranchReleased) {
    if (splitVersion[1] == "0") {
      prerelease = "-alpha"
    } else {
      prerelease = "-beta"
    }
    displayVersion += prerelease
  }
  def props = [
      solr_version: "${splitVersion[0]}.${splitVersion[1]}.${splitVersion[2]}",
      solr_version_major: splitVersion[0],
      solr_version_minor: splitVersion[1],
      solr_version_patch: splitVersion[2],
      displayVersion: displayVersion,
      prerelease: prerelease,
  ]
  props.putAll([
      solr_javadocs_link: "https://solr.apache.org/docs/${props.solr_version.replace(".", "_")}",
      lucene_javadocs_link: project(':solr:documentation').luceneDocUrl,
  ])

  doLast {
    // Set these dependency versions as lazy gstrings so that they're resolved after evaluation.
    // These variable names must use underscores, not dashes or periods.
    // Modifying this list also requires modifying `antora.template.yml`
    props.putAll([
        ["dep_version_commons_codec", libs.versions.commons.codec],
        ["dep_version_log4j", libs.versions.apache.log4j],
        ["dep_version_opennlp", libs.versions.apache.opennlp],
        ["dep_version_tika", libs.versions.apache.tika],
        ["dep_version_zookeeper", libs.versions.apache.zookeeper],
        ["dep_version_opentelemetry", libs.versions.opentelemetry.asProvider()],
    ].collectEntries {propKey, dependencyVersion ->
      [propKey, "${-> dependencyVersion.get()}"]
    })
    props["dep_version_lucene"] = "${-> luceneBaseVersionProvider.get()}"

    copy {
      from(templateYaml) {
        rename {
          "antora.yml"
        }
      }
      into project.ext.antoraConfigBuildDir

      expand(escapeYamlSingleQuotesString(props))
    }
  }
  inputs.properties(props)
}

task buildLocalAntoraPlaybookYaml(type: Copy) {
  group = 'Site - Local'
  description "Creates ${project.ext.localPlaybook} to build and test the site locally"

  from(project.ext.playbookTemplate) {
    rename {
      project.ext.localPlaybook
    }
  }
  into project.ext.playbooksDir

  def props = [
      'site_url': "",
      'redirect_facility': "static",
      'source_url': project.rootDir,
      'source_branches': "HEAD",
      'start_path': project.rootDir.relativePath(file(project.ext.siteStagingDir)),
      'site_dir': "./" + file(project.ext.siteStagingDir).relativePath(file(project.ext.siteDir)),
      // The Solr Operator is only aggregated into the official multi-version
      // site. Local builds render just the ref guide; operator contributors
      // preview their component from the apache/solr-operator repo (make docs).
      'additional_sources': "",
  ]

  expand(escapeYamlSingleQuotesString(props))
  inputs.properties(props)
}

task buildOfficialAntoraPlaybookYaml(type: Copy) {
  group = 'Site - Official'
  description "Creates ${project.ext.officialPlaybook} to build the official Solr ref-guide"

  from(project.ext.playbookTemplate) {
    rename {
      project.ext.officialPlaybook
    }
  }
  into project.ext.playbooksDir

  def branches = ["branch_*"]
  def operatorBranches = ["release-*"]
  if (officialSiteIncludePrerelease) {
    branches.add("main")
    operatorBranches.add("main")
  } else {
    branches.add("\"!branch_*x\"")
  }

  // Aggregate the Solr Operator docs as an additional component, sourced from
  // its release-* branches (apache/solr-operator). Each such branch carries its
  // own docs/antora.yml (component 'operator'). edit_url is overridden per
  // source so "Edit this page" points at the operator repo rather than apache/solr.
  def operatorSources = """
  - url: "https://github.com/apache/solr-operator.git"
    branches: ${JsonOutput.toJson(operatorBranches)}
    start_path: docs"""

  def props = [
      'site_url': "https://solr.apache.org/guide",
      'redirect_facility': "httpd",
      'source_url': "https://github.com/apache/solr.git",
      'source_branches': branches,
      'start_path': 'solr/solr-ref-guide',
      'site_dir': "./" + file(project.ext.playbooksDir).relativePath(file(project.ext.siteDir)),
      'additional_sources': operatorSources,
  ]

  expand(escapeYamlSingleQuotesString(props))
  inputs.properties(props)
}

dependencies {
  localPlaybook files("${project.ext.playbooksDir}/${project.ext.localPlaybook}") {
    builtBy tasks.buildLocalAntoraPlaybookYaml
  }
  officialPlaybook files("${project.ext.playbooksDir}/${project.ext.officialPlaybook}") {
    builtBy tasks.buildOfficialAntoraPlaybookYaml
  }
}

/*
    Downloading Build Tools
 */

task downloadAntoraCli(type: NpmTask) {
  group = 'Build Dependency Download'
  args = ["install", "@antora/cli@${libs.versions.antora.asProvider().get()}"]

  inputs.property("Antora version", libs.versions.antora.asProvider().get())
  outputs.dir("${project.ext.nodeProjectDir}/node_modules/@antora/cli")
}

task downloadAntoraSiteGenerator(type: NpmTask) {
  group = 'Build Dependency Download'
  args = ["install", "@antora/site-generator-default@${libs.versions.antora.asProvider().get()}"]

  inputs.property("Antora version", libs.versions.antora.asProvider().get())
  outputs.dir("${project.ext.nodeProjectDir}/node_modules/@antora/site-generator-default")
}

task downloadAntoraLunrExtension(type: NpmTask) {
  group = 'Build Dependency Download'
  args = ["install", "@antora/lunr-extension@${libs.versions.antora.lunr.extension.get()}"]

  inputs.property("Antora lunr-extension version", libs.versions.antora.lunr.extension.get())
  outputs.dir("${project.ext.nodeProjectDir}/node_modules/@antora/lunr-extension")
}

task downloadAsciidoctorMathjaxExtension(type: NpmTask) {
  group = 'Build Dependency Download'
  args = ["install", "@djencks/asciidoctor-mathjax@${libs.versions.asciidoctor.mathjax.get()}"]

  inputs.property("asciidoctor-mathjax version", libs.versions.asciidoctor.mathjax.get())
  outputs.dir("${project.ext.nodeProjectDir}/node_modules/@djencks/asciidoctor-mathjax")
}

task downloadAsciidoctorTabsExtension(type: NpmTask) {
  group = 'Build Dependency Download'
  args = ["install", "-D", "@asciidoctor/tabs@${libs.versions.asciidoctor.tabs.get()}"]

  inputs.property("asciidoctor-tabs version", libs.versions.asciidoctor.tabs.get())
  outputs.dir("${project.ext.nodeProjectDir}/node_modules/@asciidoctor/tabs")
}

task downloadAntora {
  group = 'Build Dependency Download'
  description "Download all Antora build dependencies for site generation."

  dependsOn tasks.downloadAntoraCli
  dependsOn tasks.downloadAntoraSiteGenerator
  dependsOn tasks.downloadAntoraLunrExtension
  dependsOn tasks.downloadAsciidoctorMathjaxExtension
  dependsOn tasks.downloadAsciidoctorTabsExtension
}

task downloadLinkValidator(type: NpmTask) {
  group = 'Build Dependency Download'
  args = ["install", "link-checker@${libs.versions.link.checker.get()}"]

  inputs.property("link-checker version", libs.versions.link.checker.get())
  outputs.dir("${project.ext.nodeProjectDir}/node_modules/link-checker")
}

task downloadDefaultUITemplate(type: NpmTask) {
  group = 'Build Dependency Download'
  args =
      ["install", "gitlab:antora/antora-ui-default#${libs.versions.antora.default.ui.get()}", "--include=dev"]

  inputs.property("Antora default-ui version", libs.versions.antora.default.ui.get())
  outputs.dir("${project.ext.nodeProjectDir}/node_modules/@antora/ui-default")
}

task startUIBuildDir(type: Copy) {
  group = 'Site - UI'
  dependsOn tasks.downloadDefaultUITemplate

  // Copy the antora latest default ui into the root folder, to mimic a new checkout of the default ui
  with {
    from "${project.ext.nodeProjectDir}/node_modules/@antora/ui-default"
    duplicatesStrategy = 'EXCLUDE'
  }

  // Overwrite the parts of the UI that we have changed.
  from("${projectDir}/ui-src") {
    into "src"
  }
  duplicatesStrategy = 'INCLUDE'

  into project.ext.uiBuildDir
}

task setupUIBuildDir(type: NpmTask) {
  group = 'Site - UI'
  dependsOn tasks.startUIBuildDir
  workingDir = file(project.ext.uiBuildDir)
  args = ["install"]

  inputs.files("${project.ext.uiBuildDir}/package.json")
  outputs.dir("${project.ext.uiBuildDir}/node_modules/")
}

// Note that Gulp must be installed in the UI Build Directory, not our project node_modules
task downloadGulp(type: NpmTask) {
  group = 'Build Dependency Download'
  dependsOn tasks.startUIBuildDir

  args = ["install", "gulp-cli@${libs.versions.gulp.cli.get()}", "--legacy-peer-deps"]
  execOverrides {
    // The it variable contains the `ExecSpec`
    workingDir = project.ext.uiBuildDir
  }

  inputs.property("Antora version", libs.versions.antora.asProvider().get())
  inputs.property("Gulp CLI version", libs.versions.gulp.cli.get())
  outputs.dir("${project.ext.uiBuildDir}/node_modules/")
}

/*
    Build and/or validate the Site
 */

task buildUIBundle(type: NpxTask) {
  group = 'Site - UI'
  description "Creates a local UI bundle using the 'ui-src' directory. This can be used to preview UI changes with a local or official ref-guide build."

  dependsOn tasks.setupUIBuildDir
  dependsOn tasks.downloadGulp

  command = "gulp"

  args = [
      "bundle",
  ]
  execOverrides {
    // The it variable contains the `ExecSpec`
    workingDir = project.ext.uiBuildDir
  }

  doLast {
    copy {
      from "${project.ext.uiBuildDir}/build/ui-bundle.zip"
      into "${buildDir}/dist"
    }
  }

  inputs.files(fileTree("${project.ext.uiBuildDir}/src"))
  outputs.file("${buildDir}/dist/ui-bundle.zip")

  doLast {
    project.logger.lifecycle("The generated ui-bundle.zip can be found at:")
    project.logger.lifecycle("\t${buildDir}/dist/ui-bundle.zip")
  }
}

task setupLocalSiteStagingDir(type: Sync) {
  group = 'Site - Local'
  description "Creates a staging directory to build the local ref-guide."

  dependsOn tasks.buildLocalAntoraYaml
  dependsOn configurations.localPlaybook

  from(projectDir) {
    include "modules/**"
  }
  from project.ext.localAntoraYaml
  from(project.ext.playbooksDir) {
    include project.ext.localPlaybook
    rename {
      "playbook.yml"
    }
  }

  into project.ext.siteStagingDir
}

task buildLocalAntoraSite(type: NpxTask) {
  group = 'Site - Local'
  description "Creates a local build of the ref-guide."

  dependsOn tasks.downloadAntora
  dependsOn tasks.setupLocalSiteStagingDir

  command = "antora"

  // Use a local build of the Lucene and Solr javadocs for a local refGuide
  def extraArgs = [
      // This attribute should not include ":link", the other 2 should
      // This attribute should also not be relative, because it is used in multiple path directories in the site
      "--attribute", "page-solr-javadocs=${project(':solr:documentation').docroot.toURI().toASCIIString()}",
      "--attribute", "solr-javadocs=link:../../../${file(project.ext.siteDir).relativePath(project(':solr:documentation').docroot)}",
      "--attribute", "lucene-javadocs=link:../../../${file(project.ext.siteDir).relativePath(project(':solr:documentation').luceneDocsDir)}"
  ]

  if (buildLocalUI) {
    dependsOn tasks.buildUIBundle
    extraArgs.addAll([
        "--ui-bundle-url", "${buildDir}/dist/ui-bundle.zip"
    ])
    inputs.files("${buildDir}/dist/ui-bundle.zip")
  }

  args = [
      "${project.ext.siteStagingDir}/playbook.yml",
      "--fetch"
  ] + extraArgs

  // Configure HTTP request timeout via preload script to prevent timeout errors
  // when downloading UI bundle from slow networks (especially in CI)
  def nodeOptions = "--require ${projectDir}/increase-request-timeout.js"

  environment = [
      "SITE_SEARCH_ENABLED": "true",
      "MATOMO_ENABLED": "false",
      "NODE_OPTIONS": nodeOptions,
      "HTTP_REQUEST_TIMEOUT_MS": "60000"  // 60 seconds timeout
  ]

  inputs.files(fileTree(project.ext.siteStagingDir))
  inputs.property("Antora version", libs.versions.antora.asProvider().get())
  outputs.dir(project.ext.siteDir)
}

task buildLocalSite {
  group = 'Site - Local'
  description "Creates a local build of the ref-guide, with local javadocs to link to."

  dependsOn tasks.buildLocalAntoraSite
  dependsOn configurations.localJavadocs

  doLast {
    project.logger.lifecycle("The generated local ref-guide can be found at:")
    project.logger.lifecycle("\t${project.ext.siteDir}/index.html")
  }
}

task checkSiteLinks(type: NpxTask) {
  group = 'Verification'
  description "Check that all links in the ref-guide, both internal and java-docs, are correct."

  dependsOn tasks.downloadLinkValidator
  dependsOn tasks.buildLocalSite

  command = "link-checker"
  args = [
      "${buildDir}/site",
      "--url-ignore", "file:/",
      "--mkdocs",
      "--allow-hash-href",
      "--disable-external",
      "--debug",
      // Ignore the java docs url in the header, since it is an absolute path
      "--url-ignore", "${project(':solr:documentation').docroot.toPath()}/index\\.html",
      "--json",
      "-v",
  ]

  def outputFile = "${buildDir}/validation/link-check.json"
  execOverrides {
    // The it variable contains the `ExecSpec`
    it.standardOutput = new TeeOutputStream(it.standardOutput, new FileOutputStream(outputFile))
  }

  inputs.files(fileTree(siteDir))
  outputs.file(outputFile)
}

/*
    Build and setup the official Site
 */
task setOfficialAntoraYaml {
  group = 'Site - Official'
  description "Setups the local antora.yml as the official antora.yml for this branch. Note: This will change the antora.yml in the repo, not a build folder."

  dependsOn tasks.buildLocalAntoraYaml

  inputs.file(project.ext.localAntoraYaml)
  outputs.file("antora.yml")

  doLast {
    copy {
      from project.ext.localAntoraYaml
      into projectDir
    }
  }
}

task buildOfficialSite(type: NpxTask) {
  group = 'Site - Official'
  description "Creates a build of the official ref-guide. This will not include local changes."

  dependsOn tasks.downloadAntora
  dependsOn configurations.officialPlaybook

  command = "antora"

  def officialPlaybook = "${project.ext.playbooksDir}/${project.ext.officialPlaybook}"
  def extraArgs = []

  if (buildLocalUI) {
    dependsOn tasks.buildUIBundle
    extraArgs.addAll([
        "--ui-bundle-url", "${buildDir}/dist/ui-bundle.zip"
    ])
    inputs.files("${buildDir}/dist/ui-bundle.zip")
  }

  args = [
      officialPlaybook,
  ] + extraArgs

  // Configure HTTP request timeout via preload script to prevent timeout errors
  // when downloading UI bundle from slow networks (especially in CI)
  def nodeOptions = "--require ${projectDir}/increase-request-timeout.js"

  environment = [
      "SITE_SEARCH_ENABLED": "true",
      "MATOMO_ENABLED": "true",
      "NODE_OPTIONS": nodeOptions,
      "HTTP_REQUEST_TIMEOUT_MS": "60000"  // 60 seconds timeout
  ]

  inputs.files(officialPlaybook)
  inputs.property("Antora version", libs.versions.antora.asProvider().get())
  outputs.dir(project.ext.siteDir)

  doLast {
    project.logger.lifecycle("The generated official ref-guide can be found at:")
    project.logger.lifecycle("\t${project.ext.siteDir}")
  }
}

/*
 CLI Documentation Generation from Picocli Annotations
 Generates per-command AsciiDoc reference pages for the Antora ref guide.
 Usage:
   ./gradlew :solr:solr-ref-guide:generateCliDocs   -- regenerate pages/cli/
   ./gradlew :solr:solr-ref-guide:checkCliDocsUpToDate -- verify in-sync (also run by check)
 */

def ASF_LICENSE_HEADER = """\
// Licensed to the Apache Software Foundation (ASF) under one
// or more contributor license agreements.  See the NOTICE file
// distributed with this work for additional information
// regarding copyright ownership.  The ASF licenses this file
// to you under the Apache License, Version 2.0 (the
// "License"); you may not use this file except in compliance
// with the License.  You may obtain a copy of the License at
//
//   http://www.apache.org/licenses/LICENSE-2.0
//
// Unless required by applicable law or agreed to in writing,
// software distributed under the License is distributed on an
// "AS IS" BASIS, WITHOUT WARRANTIES OR CONDITIONS OF ANY
// KIND, either express or implied.  See the License for the
// specific language governing permissions and limitations
// under the License.
"""

def EXPERIMENTAL_NOTICE = """\
[WARNING]
====
This page documents the *experimental* picocli implementation of `bin/solr`, which is not enabled by default.
For what `bin/solr` does by default, see xref:solr-control-script-reference.adoc[].
See xref:cli/index.adoc[] to enable this implementation and for its known limitations.
====
"""

def DO_NOT_EDIT_NOTICE = """\
//
// DO NOT EDIT -- this page is auto-generated from picocli annotations.
// To update: modify the @Command/@Option annotations in the Java source, then run:
//   ./gradlew :solr:solr-ref-guide:generateCliDocs
"""

// Convert a generated filename stem (e.g. "solr-zk-ls") to an Antora page title
// e.g. "solr-zk-ls" -> "bin/solr zk ls"
String cliFileNameToTitle(String baseName) {
  def parts = baseName.split('-')
  return "bin/solr " + parts.drop(1).join(' ')
}

// Return the short nav label for a command file (last segment of dash-separated name)
// e.g. "solr-zk-ls" -> "ls"
String cliFileNameToNavLabel(String baseName) {
  return baseName.split('-').last()
}

// Strip "[...]" (optional groups) and "(...)" (required groups whose members
// aren't *individually* required), repeating until no inner groups remain.
// Tokens left in the result are the ones the user must always provide.
String stripSynopsisGroups(String text) {
  String s = text
  String prev = null
  while (s != prev) {
    prev = s
    s = s.replaceAll(/\[[^\[\]]*\]/, '')
    s = s.replaceAll(/\([^()]*\)/, '')
  }
  return s
}

Set<String> extractRequiredTokens(String synopsis, java.util.regex.Pattern pattern) {
  def result = new LinkedHashSet<String>()
  def m = stripSynopsisGroups(synopsis) =~ pattern
  while (m.find()) { result.add(m.group(1)) }
  return result
}

// Parse the wrapped synopsis to find required (unbracketed) options and positional
// args, then prepend a "*(required)*" marker to their description lines in the
// Options and Arguments sections. Picocli's ManPageGenerator doesn't emit a
// per-option required marker, so we use the synopsis bracketing as the source of
// truth instead of reaching into the CommandSpec.
// See https://github.com/remkop/picocli/issues/2519.
// Normalize a generated CLI page before comparing committed vs freshly generated content.
// Absorbs cosmetic churn (line endings, trailing whitespace, blank-line runs and the
// generator's tag comments) so that a picocli upgrade does not fail `check` repo-wide
// for a purely presentational difference.
String normalizeCliDoc(String content) {
  return content
    .replace('\r\n', '\n')
    .replaceAll(/(?m)^\/\/ (tag|end)::picocli-generated-[^\n]*$/, '')
    .replaceAll(/(?m)[ \t]+$/, '')
    .replaceAll(/\n{3,}/, '\n\n')
    .trim()
}

String markRequiredOptionsAndArgs(String content) {
  final String MARKER = '*(required)*'
  final def OPTION_NAME = ~/(-{1,2}[a-zA-Z][a-zA-Z0-9-]*)/
  final def POSITIONAL_NAME = ~/(<[^<>\s]+>)/

  def synopsisMatch = content =~ /(?s)== Synopsis\n\n\.{4}\n(.*?)\n\.{4}/
  if (!synopsisMatch.find()) {
    // Required-ness is inferred by re-parsing the synopsis picocli generated, because
    // ManPageGenerator emits no per-option required marker (picocli #2519). If the
    // synopsis format ever changes, fail loudly rather than silently publishing pages
    // with every '*(required)*' marker missing.
    throw new GradleException(
      "Could not locate the Synopsis block while post-processing a generated CLI page. " +
      "The picocli ManPageGenerator output format has probably changed; " +
      "markRequiredOptionsAndArgs in solr-ref-guide/build.gradle needs updating.")
  }

  def synopsisText = synopsisMatch.group(1).replaceAll(/\s+/, ' ')
  def requiredOpts = extractRequiredTokens(synopsisText, OPTION_NAME)
  def requiredArgs = extractRequiredTokens(synopsisText, POSITIONAL_NAME)

  if (!requiredOpts.isEmpty()) {
    content = content.replaceAll(/(?m)^(\*-[^\n]+::)\n( +)([^\n]+)/) { List<String> m ->
      def (label, indent, descLine) = [m[1], m[2], m[3]]
      if (descLine.startsWith(MARKER)) return m[0]
      def beforeEq = label.replaceAll(/[*_]/, '').split('=', 2)[0]
      def names = (beforeEq =~ OPTION_NAME).collect { it[1] }
      names.any { requiredOpts.contains(it) }
        ? "${label}\n${indent}${MARKER} ${descLine}" : m[0]
    }
  }

  if (!requiredArgs.isEmpty()) {
    content = content.replaceAll(/(?m)^_(<[^<>\n]+>)_::\n( +)([^\n]+)/) { List<String> m ->
      def (name, indent, descLine) = [m[1], m[2], m[3]]
      if (descLine.startsWith(MARKER)) return m[0]
      requiredArgs.contains(name)
        ? "_${name}_::\n${indent}${MARKER} ${descLine}" : m[0]
    }
  }
  return content
}

// Post-process a raw ManPageGenerator AsciiDoc file for Antora compatibility.
// The title lives inside the man-section-header block, so we replace the whole
// header block with an Antora-compatible page title + attributes.
String postProcessCliManPage(File rawFile, String asfHeader, String doNotEditNotice, String experimentalNotice) {
  def content = rawFile.text
  def baseName = rawFile.name.replace('.adoc', '')
  def newTitle = cliFileNameToTitle(baseName)

  // Replace the entire man-section-header block (which contains :doctype:manpage, the page title
  // "= solr-start(1)", etc.) with our Antora-compatible title and page attributes.
  content = content.replaceAll(
    /(?s)\/\/ tag::picocli-generated-man-section-header\[\].*?\/\/ end::picocli-generated-man-section-header\[\]\n\n?/,
    "= ${newTitle}\n:page-toclevels: 2\n\n")

  // Fix xref paths: ManPageGenerator generates "xref:solr-*.adoc" but in Antora xrefs are resolved
  // from the module's pages/ root, so pages/cli/ files need the "cli/" prefix.
  content = content.replace('xref:solr-', 'xref:cli/solr-')

  // ManPageGenerator renders the command's file-stem as "solr-start" (parent-dash-child) in the
  // Name section. Replace occurrences of that with the correct spaced form "bin/solr start".
  // Use a negative lookahead (?!-) to avoid replacing "solr-zk" inside xref paths like
  // "xref:cli/solr-zk-downconfig.adoc" where it is a prefix of a longer command name.
  content = content.replaceAll("${baseName}(?!-)", newTitle)

  // Wrap the synopsis paragraph in a literal block to preserve line breaks and indentation.
  // ManPageGenerator generates a plain paragraph with picocli AsciiDoc marks (*bold*, _italic_)
  // which Asciidoctor collapses to a single line. A `....` literal block preserves whitespace
  // but does not render inline formatting, so we strip the marks for a clean monospace output.
  content = content.replaceAll(
    /(?s)(== Synopsis\n\n)(.*?)(\n\n\/\/ end::picocli-generated-man-section-synopsis\[\])/
  ) { List<String> m ->
    def synopsis = m[2]
      .replaceAll(/\*([^*]+)\*/, '$1')  // *bold* → plain
      .replaceAll(/_([^_]+)_/, '$1')    // _italic_ → plain
      .replaceAll(/(?m)^solr /, 'bin/solr ')  // qualified name "solr start" → "bin/solr start"
      .replaceAll(/(?m)^( +)/, '    $1')     // re-align wrapped lines: add 4 spaces ("bin/" length)
    "${m[1]}....\n${synopsis}\n....${m[3]}"
  }

  content = markRequiredOptionsAndArgs(content)

  // Strip the outer full-manpage tag wrappers
  content = content.replace("// tag::picocli-generated-full-manpage[]\n", '')
  content = content.replace("// end::picocli-generated-full-manpage[]\n", '')

  // The Name section repeats the Description verbatim for every command, and the page title
  // already names the command, so drop it.
  content = content.replaceAll(
    /(?s)\/\/ tag::picocli-generated-man-section-name\[\].*?\/\/ end::picocli-generated-man-section-name\[\]\n\n?/, '')

  // Drop tag comment pairs left empty because the command has no such section.
  content = content.replaceAll(
    /(?m)^\/\/ tag::(picocli-generated-[^\[]+)\[\]\n\/\/ end::\1\[\]\n\n?/, '')

  // picocli emits man-page style headings; match the house style used by every other page.
  content = content.replaceAll(/(?m)^==\s+(.*?):\s*$/, '== $1')

  // Inserted last, after the blanket 'xref:solr-' -> 'xref:cli/solr-' rewrite above, which would
  // otherwise redirect this notice's own link into pages/cli/.
  content = content.replace(":page-toclevels: 2\n", ":page-toclevels: 2\n\n" + experimentalNotice)

  return asfHeader + doNotEditNotice + "\n" + content.stripTrailing() + "\n"
}

// Build the CLI sub-page nav entries from the generated .adoc files in destDir.
// Returns a list of nav lines like "** xref:cli/solr-start.adoc[start]"
// Build the "Migrated Commands" table for the hand-written cli/index.adoc, so that the list of
// migrated commands cannot drift from the set of generated pages.
String buildCliCommandTable(File cliDir) {
  def files = ((cliDir.listFiles() ?: []) as List<File>)
    .findAll { it.name.startsWith('solr-') && it.name.endsWith('.adoc') }
    .sort { it.name }
  def rows = files.collect { file ->
    def baseName = file.name.replace('.adoc', '')
    "|xref:cli/${file.name}[${cliFileNameToTitle(baseName)}]"
  }
  return "[cols=\"1\",options=\"header\"]\n|===\n|Command\n\n" + rows.join('\n') + "\n|==="
}

List<String> buildCliNavEntries(File cliDir) {
  // Sort so that parent commands always precede their children.
  // The trick: append '\u0000' (NUL, ASCII 0) to the stem before sorting.
  // NUL < '-' (ASCII 45), so "solr-zk\0" < "solr-zk-cp\0", placing the parent first.
  def files = ((cliDir.listFiles() ?: []) as List<File>)
    .findAll { it.name.startsWith('solr-') && it.name.endsWith('.adoc') }
    .sort { (it.name.replace('.adoc', '') + '\u0000') }
  def stems = files.collect { it.name.replace('.adoc', '') } as Set
  return files.collect { file ->
    def baseName = file.name.replace('.adoc', '')
    def label = cliFileNameToNavLabel(baseName)
    // Nest under the deepest ancestor that is itself a generated page. Counting dashes instead
    // would mis-nest a command whose own name contains one, e.g. a future "snapshot-create"
    // would be filed under a "solr-snapshot" page that does not exist.
    def depth = 0
    for (def stem = baseName; stem.contains('-'); ) {
      stem = stem.substring(0, stem.lastIndexOf('-'))
      if (stems.contains(stem)) {
        depth++
      }
    }
    // Generated pages hang off cli/index.adoc, which itself sits under the control script page,
    // so the shallowest generated page is already three levels deep.
    def stars = '*' * (depth + 3)
    "${stars} xref:cli/${file.name}[${label}]"
  }
}

// Run ManPageGenerator and return the set of generated files (excluding the top-level solr.adoc).
// SolrCLI is annotated @Command(name="solr"), so ManPageGenerator writes all files flat into outputDir.
interface CliDocsExecOperationsHolder {
  @Inject
  ExecOperations getExecOperations()
}

List<File> runManPageGenerator(File outputDir) {
  // Project.javaexec was removed in Gradle 9; use injected ExecOperations instead
  def execOps = project.objects.newInstance(CliDocsExecOperationsHolder).execOperations
  execOps.javaexec {
    classpath = configurations.cliClasspath
    mainClass = 'picocli.codegen.docgen.manpage.ManPageGenerator'
    args = ['--outdir', outputDir.absolutePath, 'org.apache.solr.cli.SolrCLI']
  }

  // Exclude solr.adoc (the top-level parent page — we don't publish it as a standalone page)
  return (outputDir.listFiles() as List<File>)
    .findAll { f -> f.name.endsWith('.adoc') && f.name != 'solr.adoc' }
    .sort { it.name }
}

task generateCliDocs {
  group = 'generation'
  description = 'Regenerate CLI reference pages in pages/cli/ from picocli annotations.'

  dependsOn ':solr:core:classes'

  def rawOutputDir = file("${buildDir}/generated-cli-docs-raw")
  def destDir = file("modules/deployment-guide/pages/cli")
  def navFile = file("modules/deployment-guide/deployment-nav.adoc")

  inputs.files(configurations.cliClasspath)
  // destDir and navFile live in the source tree, so they are deliberately not declared
  // as task outputs: Gradle's stale-output cleanup would be entitled to delete committed
  // documentation. This is a developer-invoked regeneration task, so always run it.
  // checkCliDocsUpToDate is the incremental half of this pair.
  outputs.upToDateWhen { false }

  doLast {
    rawOutputDir.mkdirs()
    destDir.mkdirs()

    def rawFiles = runManPageGenerator(rawOutputDir)

    rawFiles.each { rawFile ->
      def processed = postProcessCliManPage(rawFile, ASF_LICENSE_HEADER, DO_NOT_EDIT_NOTICE, EXPERIMENTAL_NOTICE)
      new File(destDir, rawFile.name).text = processed
    }

    // Refresh the command table in the hand-written landing page
    def indexFile = new File(destDir, 'index.adoc')
    if (indexFile.exists()) {
      def indexContent = indexFile.text
      if (indexContent.contains('// CLI-DOCS-TABLE-START')) {
        def table = buildCliCommandTable(destDir)
        indexFile.text = indexContent.replaceAll(
          /(?s)\/\/ CLI-DOCS-TABLE-START.*?\/\/ CLI-DOCS-TABLE-END/,
          "// CLI-DOCS-TABLE-START\n${table}\n// CLI-DOCS-TABLE-END")
      } else {
        logger.warn("cli/index.adoc does not contain // CLI-DOCS-TABLE-START marker; table not updated.")
      }
    }

    // Update the CLI nav section in deployment-nav.adoc between marker comments
    def navContent = navFile.text
    if (navContent.contains('// CLI-DOCS-START')) {
      def navEntries = buildCliNavEntries(destDir).join('\n')
      def replacement = "// CLI-DOCS-START\n${navEntries}\n// CLI-DOCS-END"
      navContent = navContent.replaceAll(/(?s)\/\/ CLI-DOCS-START.*?\/\/ CLI-DOCS-END/, replacement)
      navFile.text = navContent
    } else {
      logger.warn("deployment-nav.adoc does not contain // CLI-DOCS-START marker; nav not updated.")
    }

    logger.lifecycle("Generated ${rawFiles.size()} CLI doc pages in ${destDir}")
  }
}

task checkCliDocsUpToDate {
  group = 'verification'
  description = 'Verify that pages/cli/ CLI docs are in sync with picocli annotations.'

  dependsOn ':solr:core:classes'

  def rawOutputDir = file("${buildDir}/generated-cli-docs-check")
  def committedDir = file("modules/deployment-guide/pages/cli")

  def stampFile = file("${buildDir}/cli-docs-check.stamp")

  inputs.files(configurations.cliClasspath)
  inputs.dir(committedDir)
  outputs.dir(rawOutputDir)
  outputs.file(stampFile)

  doLast {
    rawOutputDir.mkdirs()

    def rawFiles = runManPageGenerator(rawOutputDir)
    def issues = []

    rawFiles.each { rawFile ->
      def processed = postProcessCliManPage(rawFile, ASF_LICENSE_HEADER, DO_NOT_EDIT_NOTICE, EXPERIMENTAL_NOTICE)
      def committed = new File(committedDir, rawFile.name)
      if (!committed.exists()) {
        issues << "MISSING committed file (new command): ${rawFile.name}"
      } else {
        if (normalizeCliDoc(processed) != normalizeCliDoc(committed.text)) {
          issues << "OUT OF DATE: ${rawFile.name}"
        }
      }
    }

    // Check for committed pages that are no longer generated (deleted commands)
    if (committedDir.exists()) {
      def generatedNames = rawFiles.collect { it.name }.toSet()
      // Only sweep generated pages; hand-written pages such as index.adoc are not generated.
      ((committedDir.listFiles() ?: []) as List<File>).findAll {
        it.name.startsWith('solr-') && it.name.endsWith('.adoc')
      }.each { committed ->
        if (!generatedNames.contains(committed.name)) {
          issues << "STALE (command removed): ${committed.name}"
        }
      }
    }

    if (!issues.isEmpty()) {
      throw new GradleException(
        "CLI docs are out of date. Run './gradlew :solr:solr-ref-guide:generateCliDocs' to regenerate.\n" +
        "This also applies after changing the picocli version, since the generated wording\n" +
        "can change without any annotation having been touched.\n" +
        "Issues:\n" + issues.collect { "  - ${it}" }.join('\n'))
    }
    stampFile.parentFile.mkdirs()
    stampFile.text = "CLI docs verified at ${new Date()}\n"
    logger.lifecycle("CLI docs are up to date.")
  }
}


