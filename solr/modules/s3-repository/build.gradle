apply plugin: 'java-library'

description = 'S3 Repository'

ext {
  // S3Mock now runs as a Testcontainers-managed Docker container (S3MockContainerRule), which
  // does PATH scanning, spawns processes, and talks to the Docker daemon over a Unix socket --
  // none of which play well with a static SecurityManager policy. Same rationale as
  // solr:cross-dc-manager and solr:modules:extraction, Solr's other Testcontainers consumers.
  useSecurityManager = false
}

configurations.configureEach {
  // On Netty 4.2 this is an empty aggregator of codecs netty-nio-client does not use
  exclude group: 'io.netty', module: 'netty-codec'
}

dependencies {
  implementation platform(project(':platform'))
  api(project(':solr:core'))

  // The encryption client's classes carry SpotBugs annotations, which javac needs to resolve.
  // It is not included in the release so exclude from checks.
  compileOnly libs.spotbugs.annotations
  testCompileOnly libs.spotbugs.annotations
  configurations.jarValidation {
    exclude group: "com.github.spotbugs", module: "spotbugs-annotations"
  }

  implementation libs.apache.lucene.core

  implementation platform(libs.amazon.awssdk.bom)
  implementation libs.amazon.awssdk.auth
  implementation libs.amazon.awssdk.apacheclient
  implementation libs.amazon.awssdk.awscore
  implementation libs.amazon.awssdk.regions
  implementation libs.amazon.awssdk.httpclient.spi
  implementation libs.amazon.awssdk.retries.spi
  implementation libs.amazon.awssdk.s3
  implementation libs.amazon.awssdk.sdkcore
  // The encryption client routes object reads and writes through an S3AsyncClient
  implementation libs.amazon.awssdk.nettynioclient
  implementation(libs.amazon.s3encryption.client) {
    // only used by enableMultipartPutObject, which Solr does not use
    exclude group: 'joda-time', module: 'joda-time'
    // Duplicates jakarta.activation-api; the client only uses saaj-impl's MimeUtility.decodeText
    exclude group: 'com.sun.activation', module: 'jakarta.activation'
    // saaj-impl's SOAP dependencies, which MimeUtility.decodeText does not reach
    exclude group: 'jakarta.xml.soap', module: 'jakarta.xml.soap-api'
    exclude group: 'org.jvnet.staxex', module: 'stax-ex'
  }
  // The encryption client logs through commons-logging, which is globally excluded
  runtimeOnly libs.slf4j.jcloverslf4j
  // Unlike the JDK's provider, BouncyCastle's AES-GCM releases plaintext before the tag is checked
  implementation libs.bouncycastle.bcprov

  runtimeOnly libs.amazon.awssdk.sts

  implementation libs.google.guava
  implementation libs.slf4j.api

  runtimeOnly libs.fasterxml.woodstox.core
  runtimeOnly libs.codehaus.woodstox.stax2api

  testImplementation project(':solr:test-framework')
  testImplementation libs.apache.lucene.testframework
  testImplementation libs.carrotsearch.randomizedtesting.runner
  testImplementation libs.junit.junit
  testImplementation libs.amazon.awssdk.profiles

  testImplementation libs.hamcrest.hamcrest

  testImplementation libs.adobe.testing.s3mock.testcontainers

  testImplementation libs.commonsio.commonsio

  testImplementation(libs.mockito.core, {
    exclude group: "net.bytebuddy", module: "byte-buddy-agent"
  })
  testRuntimeOnly(libs.mockito.subclass, {
    exclude group: "net.bytebuddy", module: "byte-buddy-agent"
  })
}

test {
  environment "aws.accessKeyId", "foo"
  environment "aws.secretAccessKey", "bar"
}
