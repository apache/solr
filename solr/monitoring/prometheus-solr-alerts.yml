# This file is generated by mixin/alerts/alerts.libsonnet — do not edit directly.
# To regenerate: cd mixin && make alerts
groups:
- name: SolrAlerts
  rules:
  - alert: SolrHighHeapUsage
    annotations:
      description: |
        Node {{ $labels.instance }} is using {{ $value | humanizePercentage }} of its JVM
        heap (threshold: 90%). Raise -Xmx, or reduce cache sizes.
      summary: Solr node {{ $labels.instance }} has high JVM heap usage
    expr: |
      sum by (instance) (
        max by (instance, jvm_memory_pool_name) (
          jvm_memory_used_bytes{job="solr",jvm_memory_type="heap"}
        )
      )
      /
      sum by (instance) (
        max by (instance, jvm_memory_pool_name) (
          jvm_memory_committed_bytes{job="solr",jvm_memory_type="heap"}
        )
      )
      > 0.9
    for: 2m
    labels:
      severity: critical
  - alert: SolrJvmGcThrashing
    annotations:
      description: |
        Node {{ $labels.instance }} spends {{ $value | humanize }} seconds per minute in
        garbage collection (threshold: 10). Pauses show up as search latency;
        check heap usage first, then heap sizing and GC settings.
      summary: Solr node {{ $labels.instance }} is spending much of its time in GC
    expr: |
      sum by (instance) (
        max by (instance, jvm_gc_name, jvm_gc_action) (
          rate(jvm_gc_duration_seconds_sum{job="solr"}[5m])
        )
      ) * 60
      > 10
    for: 3m
    labels:
      severity: critical
  - alert: SolrLowDiskSpace
    annotations:
      description: |
        Node {{ $labels.instance }} has {{ $value | humanizePercentage }} of its disk free
        (threshold: 15%). Indexing fails once the disk fills, and a merge needs
        room for the segments it rewrites.
      summary: Solr node {{ $labels.instance }} is low on disk space
    expr: |
      min by (instance) (solr_disk_space_megabytes{job="solr",type="usable_space"})
      /
      min by (instance) (solr_disk_space_megabytes{job="solr",type="total_space"})
      < 0.15
    for: 5m
    labels:
      severity: critical
  - alert: SolrNodeDown
    annotations:
      description: |
        Prometheus has failed to scrape {{ $labels.instance }} for 2 minutes.
        Either the node is down or its metrics endpoint is unreachable.
      summary: Solr node {{ $labels.instance }} is not responding to scrapes
    expr: up{job="solr"} == 0
    for: 2m
    labels:
      severity: warning
  - alert: SolrHighSearchLatency
    annotations:
      description: |
        Node {{ $labels.instance }} answers 99% of searches in {{ $value | humanize }}ms
        (threshold: 1000ms). Usual causes are expensive queries or faceting, caches
        too small for the working set, and GC pauses.
      summary: Solr node {{ $labels.instance }} has high search latency
    expr: |
      histogram_quantile(0.99,
        sum by (le, instance) (
          rate(
            solr_core_requests_times_milliseconds_bucket{job="solr",handler=~"/select.*",internal="false",core!=""}[5m]
          )
        )
      )
      > 1000
    for: 5m
    labels:
      severity: warning
  - alert: SolrHighErrorRate
    annotations:
      description: |
        {{ $value | humanizePercentage }} of requests to {{ $labels.instance }} are failing
        (threshold: 1%). The Solr log carries the cause: invalid queries,
        missing fields, cores that failed to load, or connectivity problems.
      summary: Solr node {{ $labels.instance }} has a high request error rate
    expr: |
      sum by (instance) (rate(solr_core_requests_errors_total{job="solr",core!=""}[5m]))
      /
      sum by (instance) (rate(solr_core_requests_total{job="solr",core!=""}[5m]))
      > 0.01
    for: 5m
    labels:
      severity: warning
  - alert: SolrOverseerQueueBuildup
    annotations:
      description: |
        {{ $value }} collection operations are queued on {{ $labels.instance }}
        (threshold: 50). The Overseer is falling behind: look for long-running
        collection operations, a disrupted election, or slow ZooKeeper.
      summary: Solr Overseer collection work queue is building up on {{ $labels.instance }}
    expr: |
      max by (instance) (solr_overseer_collection_work_queue_size{job="solr"})
      > 50
    for: 5m
    labels:
      severity: warning
  - alert: SolrHighMmapRatio
    annotations:
      description: |
        Only {{ $value | humanize }}% of the index on {{ $labels.instance }} fits in the
        memory left outside the JVM heap (threshold: 10%). The rest is read from
        disk on every search that touches it.
      summary: Little of the Solr index fits in memory on {{ $labels.instance }}
    expr: |
      (
        clamp_max(
          (
            max by (instance) (jvm_system_memory_bytes{job="solr",state="total"})
            - sum by (instance) (
              max by (instance, jvm_memory_pool_name) (
                jvm_memory_committed_bytes{job="solr",jvm_memory_type="heap"}
              )
            )
          )
          / (1024 * 1024)
          / sum by (instance) (solr_core_index_size_megabytes{job="solr"})
          * 100,
          100
        ) < 10
      )
      and on (instance)
        max by (instance) (jvm_system_memory_bytes{job="solr",state="total"}) > 0
    for: 5m
    labels:
      severity: warning
