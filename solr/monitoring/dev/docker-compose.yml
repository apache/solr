# ============================================================================
# DEVELOPER CONVENIENCE ONLY — NOT FOR PRODUCTION USE
# ============================================================================
#
# This docker-compose stack is provided solely to make it easy for contributors
# to view and test changes to the two generated monitoring artifacts:
#
#   ../grafana-solr-dashboard.json    — Grafana dashboard
#   ../prometheus-solr-alerts.yml     — Prometheus alert rules
#
# It is NOT intended as a reference deployment or a recommended production setup.
# For integrating the artifacts into your own Prometheus + Grafana installation,
# see the Solr Reference Guide (monitoring-with-prometheus-and-grafana.adoc).
#
# Quick start:
#   cd solr/monitoring/dev
#   ./stack.sh                     # Full stack with bundled Solr nodes
#   ./stack.sh --local-solr        # Monitoring only — point at your locally-running Solr
#   ./stack.sh --help              # All options
#
# Ports are published on loopback only: the stack runs Solr and ZooKeeper without
# authentication, so it must not be reachable from other hosts on the network.
#
# Services (full stack):
#   solr1        http://localhost:8983  (SolrCloud node 1, embedded ZooKeeper)
#   solr2        http://localhost:8984  (SolrCloud node 2)
#   Prometheus   http://localhost:9090
#   Grafana      http://localhost:3000  (admin / admin)
#   Alertmanager http://localhost:9093
#   otel-collector  OTLP in on http://localhost:4318, Prometheus-format out on http://localhost:9464
#   Aspire       http://localhost:18888  (raw view of the metrics and traces Solr pushed)
#   trafficgen   (no port — continuously indexes/searches the 'test' collection)
#
# The bundled Solr nodes always push metrics and traces over OTLP to otel-collector,
# which forwards both to the Aspire Dashboard. Prometheus scrapes either the nodes
# directly or the collector, depending on ./stack.sh --metrics-scrape=solr|otel.
# See ../otel-collector-config.yaml.
#
# Environment variables (set by stack.sh, or override manually):
#   PROMETHEUS_CONFIG   Path to the prometheus config to mount (default: ./prometheus/prometheus.yml)
#   METRICS_SCRAPE      solr (default) or otel — read by stack.sh, also from a ./.env file
#   SOLR_URL            Solr base URL for trafficgen (default: http://solr1:8983/solr)
#   SOLR_IMAGE          Solr image for the bundled nodes (default: apache/solr-nightly:10.2.0-SNAPSHOT, tracks branch_10x)
#   PROMETHEUS_IMAGE    Prometheus image (default: pinned, see below)
#   GRAFANA_IMAGE       Grafana image (default: pinned, see below)
#   ALERTMANAGER_IMAGE  Alertmanager image (default: pinned, see below)
#   OTEL_COLLECTOR_IMAGE  OpenTelemetry Collector image (default: pinned, see below; must be a contrib build)
#   ASPIRE_IMAGE        Aspire Dashboard image (default: pinned, see below)
#
# The monitoring images are pinned so a stack that worked yesterday still works
# today; override any of them to test against a newer release.
# ============================================================================

name: solr-telemetry-dev

# Push metrics to the collector every 15s, matching the scrape interval. The
# endpoint is the OTLP/HTTP default with the host swapped for the service name.
# OTEL_SERVICE_NAME activates the module's tracer, which pushes traces the same way.
x-solr-otlp-env: &solr-otlp-env
  SOLR_MODULES: opentelemetry
  SOLR_METRICS_OTLP_EXPORTER_ENABLED: "true"
  SOLR_METRICS_OTLP_EXPORTER_PROTOCOL: http   # explicit: Solr 10.0 defaults to grpc
  SOLR_METRICS_OTLP_EXPORTER_INTERVAL: "15000"
  SOLR_METRICS_OTLP_HTTP_EXPORTER_ENDPOINT: http://otel-collector:4318/v1/metrics
  OTEL_SERVICE_NAME: solr
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318

services:
  solr1:
    image: ${SOLR_IMAGE:-apache/solr-nightly:10.2.0-SNAPSHOT}
    profiles: [bundled-solr]
    environment:
      <<: *solr-otlp-env
      # Advertise the compose service name, so the identity Solr reports matches the name
      # Prometheus scrapes it by and both collection routes produce the same instance label.
      SOLR_HOST_ADVERTISE: solr1
    ports:
      - "127.0.0.1:8983:8983"
      - "127.0.0.1:9983:9983"   # embedded ZooKeeper (Solr 10 default: ZK_PORT = SOLR_PORT + 1000)
    # No ZK_HOST set: Solr 10 defaults to SolrCloud with embedded ZooKeeper on port 9983.
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8983/solr/admin/info/system || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  solr2:
    image: ${SOLR_IMAGE:-apache/solr-nightly:10.2.0-SNAPSHOT}
    profiles: [bundled-solr]
    ports:
      - "127.0.0.1:8984:8983"
    environment:
      <<: *solr-otlp-env
      SOLR_HOST_ADVERTISE: solr2
      ZK_HOST: "solr1:9983"
    depends_on:
      solr1:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8983/solr/admin/info/system || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.15.0}
    ports:
      - "127.0.0.1:9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${PROMETHEUS_CONFIG:-./prometheus/prometheus.yml}:/etc/prometheus/prometheus.yml:ro
      - ../prometheus-solr-alerts.yml:/etc/prometheus/rules/solr-alerts.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
    depends_on:
      solr1:
        condition: service_healthy
        required: false
      solr2:
        condition: service_healthy
        required: false
    restart: unless-stopped

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:13.2.3}
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Local throwaway stack: let anyone view without logging in, so the dashboard
      # is one click away. Log in as admin/admin to edit.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      # Land on the provisioned dashboard instead of Grafana's welcome page.
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/grafana-solr-dashboard.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana-solr-dashboard.json:/var/lib/grafana/dashboards/grafana-solr-dashboard.json:ro
    depends_on:
      - prometheus
    restart: unless-stopped

  alertmanager:
    image: ${ALERTMANAGER_IMAGE:-prom/alertmanager:v0.34.1}
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    restart: unless-stopped

  otel-collector:
    image: ${OTEL_COLLECTOR_IMAGE:-otel/opentelemetry-collector-contrib:0.164.0}
    ports:
      - "127.0.0.1:4318:4318"   # OTLP/HTTP in — a Solr on the host pushes here with its defaults
      - "127.0.0.1:9464:9464"   # Prometheus-format out
    volumes:
      - ../otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      - aspire-dashboard
    restart: unless-stopped

  aspire-dashboard:
    image: ${ASPIRE_IMAGE:-mcr.microsoft.com/aspire/dashboard:13.6.2}
    ports:
      - "127.0.0.1:18888:18888"
    environment:
      # Local throwaway stack: no login. Data is in-memory and gone on restart.
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    restart: unless-stopped

  trafficgen:
    build: ./trafficgen
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SOLR_URL: ${SOLR_URL:-http://solr1:8983/solr}
    depends_on:
      solr1:
        condition: service_healthy
        required: false
      solr2:
        condition: service_healthy
        required: false
    restart: unless-stopped
