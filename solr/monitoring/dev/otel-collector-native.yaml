#
# otel-collector-native.yaml — dev-stack overlay, merged onto the shipped
# ../otel-collector-config.yaml by passing both to the collector with --config.
# Kept out of the shipped file so that stays a lean example.
#
# Exposes the same metrics a second time with their OpenTelemetry names left
# alone, so ./check-metric-parity.py --list-otel can show what Solr actually
# sends, before any Prometheus naming is applied.

exporters:
  prometheus/native:
    endpoint: 0.0.0.0:9465
    translation_strategy: NoTranslation

service:
  pipelines:
    metrics/native:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus/native]
