#
# prometheus.yml — scrape config for the bundled Solr nodes in the dev stack.
#
# Used by docker-compose.yml in this directory. The job name must match the
# mixin's solrSelector (job="solr" by default), or the generated dashboard and
# alert rules will not match any series.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/solr-alerts.yml

scrape_configs:
  - job_name: solr
    # The v1 endpoint, which every Solr 10.x build serves. Solr 10.1 and later
    # also serve the shorter v2 alias /api/metrics.
    metrics_path: /solr/admin/metrics
    scrape_interval: 15s
    static_configs:
      - targets: ['solr1:8983', 'solr2:8983']
