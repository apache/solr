import groovy.json.JsonOutput
import groovy.json.JsonSlurper
import java.security.MessageDigest

plugins {
  id 'java'
  id 'war'
}

description = 'Solr webapp'

ext {
  // The Selenium-based Admin UI tests execute external binaries (selenium-manager,
  // chromedriver) and probe well-known browser install locations plus $PATH and
  // $CHROME_BIN for a Chrome binary. Expressing this in the shared solr-tests.policy
  // would require FilePermission execute grants on arbitrary, machine-dependent paths
  // (effectively <<ALL FILES>> execute), weakening the sandbox for every test module.
  // Following the precedent of the extraction and s3-repository modules, the security
  // manager is disabled for this module's tests instead.
  useSecurityManager = false
}

configurations {
  war {}
  serverLib
  solrCore
  generatedJSClientBundle
  generatedUIBundle
}

dependencies {
  serverLib project(path: ":solr:server", configuration: "libExt")
  serverLib project(path: ":solr:server", configuration: "serverLib")
  solrCore project(":solr:core")
  implementation(configurations.solrCore - configurations.serverLib)

  if (gradle.ext.withJsClient) {
    generatedJSClientBundle project(path: ":solr:webapp:js-client", configuration: "jsClientBundle")
  }

  if (gradle.ext.withUiModule) {
    generatedUIBundle project(path: ":solr:ui", configuration: "wasmJsUIBundle")
  }

  // Browser-based tests of the AngularJS Admin UI (see src/test)
  testImplementation project(':solr:core')
  testImplementation project(':solr:solrj')
  testImplementation project(':solr:test-framework')
  // puts the /sql handler on the in-JVM server classpath so the SQL screen works
  testRuntimeOnly project(':solr:modules:sql')
  testImplementation libs.carrotsearch.randomizedtesting.runner
  testImplementation libs.eclipse.jetty.ee10.servlet
  testImplementation libs.jakarta.servlet.api
  testImplementation libs.junit.junit
  testImplementation(libs.selenium.chromedriver, {
    // solr-core already provides the opentelemetry api/sdk that selenium's optional
    // tracing uses; the remaining excludes are compile-time-only annotation jars
    exclude group: 'io.opentelemetry'
    exclude group: 'io.opentelemetry.instrumentation'
    exclude group: 'io.opentelemetry.semconv'
    exclude group: 'com.google.auto.service'
    exclude group: 'org.jspecify'
  })
}

// Configure all Test tasks (including the generated beast test_N tasks, which do not
// inherit the default test suite wiring in this war project):
// - test classes/classpath so `gradlew -p solr/webapp beast -Ptests.dups=N` works
// - forward the browser-binary override for the Admin UI tests to the forked test JVM
tasks.withType(Test).configureEach {
  testClassesDirs = sourceSets.test.output.classesDirs
  classpath = sourceSets.test.runtimeClasspath
  def chromeBinary = providers.systemProperty('tests.selenium.chrome.binary').orNull
  if (chromeBinary != null) {
    systemProperty 'tests.selenium.chrome.binary', chromeBinary
  }

  // the Admin UI tests exercise the generated js-client bundle; a stub would only grow
  // stale as the UI adopts more of the v2 API, so without the bundle the tests cannot
  // run at all. The bundle (and thereby its node/npm toolchain) is only wired in when
  // the tests are explicitly enabled, keeping node off the default test build chain.
  def seleniumEnabled = Boolean.parseBoolean(Objects.toString(propertyOrDefault('tests.selenium', 'false')))
  if (seleniumEnabled && gradle.ext.withJsClient) {
    def jsClientBundle = configurations.generatedJSClientBundle
    inputs.files(jsClientBundle).withPropertyName('jsClientBundle')
    doFirst {
      systemProperty 'tests.ui.jsclient.bundle', new File(jsClientBundle.singleFile, 'index.js')
    }
  } else if (seleniumEnabled) {
    doFirst {
      throw new GradleException('Cannot run the Admin UI tests (-Ptests.selenium=true): ' +
          '-PdisableJsClient=true excludes the js-client bundle they need. Drop one of the two flags.')
    }
  } else if (!gradle.ext.withJsClient) {
    enabled = false
    logger.warn('NOTE: :solr:webapp tests are disabled because -PdisableJsClient=true ' +
        'excludes the js-client bundle the Admin UI tests need.')
  }
}

war {
  from("web")

  // note: nonetheless may be disabled, copying nothing
  from(configurations.generatedJSClientBundle, {
    into "libs/solr"
  })

  // note: nonetheless may be disabled, copying nothing
  from(configurations.generatedUIBundle, {
    into "ui"
  })
}

// Expose 'war' archive as an artifact so that it can be packaged in the distribution.
artifacts {
  war tasks.war
}

// web/libs holds checked-in third-party JavaScript, described for the distribution SBOM by
// vendored-libs.json. These tasks keep the two in sync: validateVendoredLibs fails on any drift,
// updateVendoredLibs refreshes the hashes. The manifest sits outside web/, which goes into the war.
def vendoredLibsManifest = file('vendored-libs.json')
def vendoredLibsDir = file('web/libs')

def sha256Of = { File f ->
  def digest = MessageDigest.getInstance('SHA-256')
  f.eachByte(8192) { buffer, length -> digest.update(buffer, 0, length) }
  digest.digest().encodeHex().toString()
}

tasks.register('validateVendoredLibs') {
  group = 'Verification'
  description = 'Checks that web/libs matches the components declared in vendored-libs.json'

  inputs.file(vendoredLibsManifest).withPropertyName('manifest')
      .withPathSensitivity(PathSensitivity.NONE)
  inputs.dir(vendoredLibsDir).withPropertyName('vendoredLibs')
      .withPathSensitivity(PathSensitivity.RELATIVE)
  def marker = layout.buildDirectory.file('vendored-libs-validated.txt')
  outputs.file(marker)

  doLast {
    def manifest = new JsonSlurper().parse(vendoredLibsManifest)
    def onDisk = vendoredLibsDir.listFiles().findAll { it.file }.collectEntries { [(it.name): it] }
    def errors = []

    (onDisk.keySet() - manifest.keySet()).sort().each {
      errors << "${it}: present in ${vendoredLibsDir} but absent from ${vendoredLibsManifest.name}."
    }
    (manifest.keySet() - onDisk.keySet()).sort().each {
      errors << "${it}: declared in ${vendoredLibsManifest.name} but no such file in ${vendoredLibsDir}."
    }

    manifest.each { fileName, component ->
      def file = onDisk[fileName]
      if (file == null) {
        return
      }
      ['type', 'bom-ref', 'name', 'purl', 'licenses', 'hashes'].each { field ->
        if (!component[field]) {
          errors << "${fileName}: component is missing the required '${field}' field."
        }
      }
      def declared = component.hashes?.find { it.alg == 'SHA-256' }?.content
      if (declared == null) {
        errors << "${fileName}: component declares no SHA-256 hash."
      } else {
        def actual = sha256Of(file)
        if (declared != actual) {
          errors << "${fileName}: content changed, SHA-256 is ${actual} but the component declares " +
              "${declared}. Review the component (version, licence, pedigree) and run 'gradlew " +
              ":solr:webapp:updateVendoredLibs' to refresh the hash."
        }
      }
    }

    if (errors) {
      throw new GradleException("Vendored JavaScript does not match ${vendoredLibsManifest}:\n  " +
          errors.join("\n  "))
    }
    marker.get().asFile.text = "${manifest.size()} vendored components validated\n"
  }
}

tasks.matching { it.name == 'check' }.configureEach {
  it.dependsOn 'validateVendoredLibs'
}

tasks.register('updateVendoredLibs') {
  group = 'Build Dependencies'
  description = 'Refreshes the SHA-256 hashes in vendored-libs.json'

  doLast {
    // JsonSlurper hands back a LinkedHashMap, so the declaration order survives the round trip.
    def manifest = new JsonSlurper().parse(vendoredLibsManifest)
    def onDisk = vendoredLibsDir.listFiles().findAll { it.file }.sort { it.name }

    onDisk.each { file ->
      def component = manifest[file.name]
      if (component == null) {
        // A stub only: identity, licence and pedigree cannot be inferred from the file, so
        // validateVendoredLibs keeps failing until they are filled in by hand.
        logger.lifecycle("${file.name}: new file, added a stub component that must be completed by hand")
        manifest[file.name] = [
            type: 'library',
            'bom-ref': null,
            name: null,
            hashes: [[alg: 'SHA-256', content: sha256Of(file)]],
            licenses: null,
            purl: null,
        ]
      } else {
        def actual = sha256Of(file)
        if (component.hashes?.find { it.alg == 'SHA-256' }?.content != actual) {
          logger.lifecycle("${file.name}: refreshed SHA-256")
          component.hashes = [[alg: 'SHA-256', content: actual]]
        }
      }
    }

    def removed = manifest.keySet() - onDisk.collect { it.name } as Set
    removed.each {
      logger.lifecycle("${it}: file is gone, dropping the component")
      manifest.remove(it)
    }

    vendoredLibsManifest.text = JsonOutput.prettyPrint(JsonOutput.toJson(manifest.sort { it.key })) + "\n"
  }
}
