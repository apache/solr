// This adds jacoco code coverage to test tasks, along with an aggregated
// coverage report for all projects.

// Coverage is opt-in: tests run with the jacoco agent only if the 'coverage'
// task is explicitly requested or -Ptests.coverage=true is passed.
def withCoverage = gradle.startParameter.taskNames.any {
  it == "coverage" || it.endsWith(":coverage")
} || Boolean.parseBoolean(propertyOrDefault("tests.coverage", "false"))

allprojects {
  plugins.withType(JavaPlugin) {
    // Expose the option in 'gradlew testOpts', regardless of whether coverage
    // is currently enabled.
    project.ext {
      testOptions += [
          [propName: 'tests.coverage', value: false, description: "Enables jacoco test coverage.", includeInReproLine: false]
      ]
    }
  }
}

if (withCoverage) {
  // Set up an aggregated coverage report over all projects with tests.
  configure(rootProject) {
    // Logs a coverage summary to the console after report tasks.
    plugins.apply("org.barfuin.gradle.jacocolog")
    plugins.apply("jacoco-report-aggregation")

    reporting {
      reports {
        testCodeCoverageReport(JacocoCoverageReport) {
          testSuiteName = "test"
        }
      }
    }

    subprojects.findAll { it.file("src/test").exists() }.each { subproject ->
      dependencies.add("jacocoAggregation", subproject)
    }

    def aggregatedReport = tasks.named("testCodeCoverageReport") {
      // XML report is consumed by CI tooling.
      reports {
        xml.required = true
      }
      doLast {
        logger.lifecycle("Aggregated code coverage report at: ${reports.html.entryPoint}\n")
      }
    }

    tasks.register("coverage") {
      dependsOn aggregatedReport
    }
  }

  allprojects {
    plugins.withType(JavaPlugin) {
      // Applies the jacoco plugin and logs a coverage summary to the console.
      plugins.apply("org.barfuin.gradle.jacocolog")

      def jacocoTestReport = tasks.named("jacocoTestReport") {
        // XML report is consumed by CI tooling.
        reports {
          xml.required = true
        }
        doLast {
          logger.lifecycle("Code coverage report at: ${reports.html.entryPoint}\n")
        }
      }

      def testTasks = tasks.withType(Test)

      tasks.register("coverage") {
        dependsOn testTasks
        dependsOn jacocoTestReport
      }

      testTasks.configureEach { Task testTask ->
        // Configure the jacoco data file to be within the test task's
        // working directory.
        jacoco {
          destinationFile = providers.provider { new File(testTask.workingDir, "jacoco.exec") }
        }

        // Test reports run after the test task, if it's run at all.
        finalizedBy jacocoTestReport
      }
    }
  }
}
