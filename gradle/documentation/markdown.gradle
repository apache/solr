buildscript {
  apply from: rootProject.file('build-tools/build-infra/declare-repositories.gradle'), to: delegate

  dependencies {
    classpath libs.flexmark.flexmark
    classpath libs.flexmark.extensions.abbreviation
    classpath libs.flexmark.extensions.attributes
    classpath libs.flexmark.extensions.autolink
  }
}

configure(project(':solr:documentation')) {
  ext {
    // Masthead assets shared by every generated documentation page.
    logoAsset = file("${project.assets}/solr.svg")
    solrHomeUrl = 'https://solr.apache.org/'
  }

  task markdownToHtml(type: Copy) {
    dependsOn copyDocumentationAssets

    filteringCharset = 'UTF-8'
    includeEmptyDirs = false
    into project.docroot
    rename(/\.md$/, '.html')
    inputs.file(project.logoAsset)
    inputs.property('version', project.version)
    filter(MarkdownFilter,
        logoFile: project.logoAsset,
        heading: 'Documentation',
        navLinks: ['Home': project.solrHomeUrl, 'Docs': 'index.html'])
  }
}

configure(project(':solr:documentation')) {
  markdownToHtml {
    from(project.markdownSrc) {
      include '**/*.md'
      exclude '**/*.template.md'
    }
  }

  task createDocumentationIndex(type: MarkdownTemplateTask) {
    dependsOn markdownToHtml

    outputFile = file("${project.docroot}/index.html")
    templateFile = file("${project.markdownSrc}/index.template.md")
    logoFile = project.logoAsset
    heading = 'Documentation'
    // The index is the Docs landing page, so it only links out to the website.
    navLinks = ['Home': project.solrHomeUrl]

    // list all properties used by the template here to allow uptodate checks to be correct:
    inputs.property('version', project.version)
    inputs.property('solrRefguideUrl', project.solrRefguideUrl)
    inputs.property('luceneDocUrl', project.luceneDocUrl)
    inputs.property('luceneDocVersion', project.luceneDocVersion)
  }

  task createJavadocsIndex(type: MarkdownTemplateTask) {
    dependsOn markdownToHtml

    outputFile = file("${project.docroot}/javadocs.html")
    templateFile = file("${project.markdownSrc}/javadocs.template.md")
    logoFile = project.logoAsset
    heading = 'Javadocs'
    // The masthead already names the page, so the body carries no <h1>.
    pageTitle = 'Solr Javadocs'
    navLinks = ['Home': project.solrHomeUrl, 'Docs': 'index.html']

    // list all properties used by the template here to allow uptodate checks to be correct:
    withProjectList()
  }
}

// The HTML every generated documentation page shares: the head, and the sticky
// masthead with the Solr wordmark and the nav links.
class SolrDocsPage {

  // The ink the wordmark is drawn in, swapped for currentColor when inlining so
  // the stylesheet can recolour it per theme. Keep in sync with changes2html.py.
  private static final String LOGO_INK_FILL = 'fill:rgb(14.048767%,12.319946%,16.685486%)'

  /** Inlines solr.svg, so a page needs no sibling image and can theme the wordmark. */
  static String inlineLogo(File logoFile) {
    if (logoFile == null || !logoFile.exists()) {
      return ''
    }
    String svg = logoFile.getText('UTF-8')
        .replaceFirst(/(?s)<\?xml[^>]*\?>\s*/, '')
        .replace(LOGO_INK_FILL, 'fill:currentColor')
        .replace('id="clip', 'id="solr-logo-clip')
        .replace('url(#clip', 'url(#solr-logo-clip')
        .replace('id="surface1"', 'id="solr-logo-surface"')
    // Drop the intrinsic pt dimensions; the viewBox and the stylesheet size it.
    return svg.replaceFirst(/<svg\b[^>]*>/) {match ->
      '<svg class="brand-logo" role="img" aria-label="Apache Solr"' +
          match.substring(4).replaceAll(/\s(?:width|height)="[^"]*"/, '')
    }.trim()
  }

  /** Reapplies the reader's stored theme before first paint, so dark mode does not flash. */
  static String themeScript() {
    return '''<script>
  (function() {
    try {
      var stored = localStorage.getItem('solr.docs.theme');
      if (stored === 'dark' || stored === 'light') {
        document.documentElement.setAttribute('data-theme', stored);
      }
    } catch (e) {
      /* localStorage can be unavailable; the light default is fine. */
    }
  })();
  function updateThemeToggle() {
    var button = document.getElementById('theme.toggle');
    if (!button) return;
    var dark = document.documentElement.getAttribute('data-theme') == 'dark';
    var label = dark ? 'Switch to light theme' : 'Switch to dark theme';
    button.title = label;
    button.setAttribute('aria-label', label);
  }
  function toggleTheme() {
    var root = document.documentElement;
    var next = root.getAttribute('data-theme') == 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try {
      localStorage.setItem('solr.docs.theme', next);
    } catch (e) {
      /* Not remembering the choice is better than failing the toggle. */
    }
    updateThemeToggle();
  }
  window.addEventListener('load', updateThemeToggle);
</script>'''
  }

  /** `links` maps a nav label to its href, in the order they should appear. */
  static String masthead(String logoSvg, String heading, Map<String, String> links) {
    StringBuilder nav = new StringBuilder()
    links.each {label, href ->
      nav.append("      <a href=\"${href}\">${label}</a>\n")
    }
    return """<header class="masthead">
  <div class="masthead-inner">
    <a class="brand" href="https://solr.apache.org/">${logoSvg}</a>
    <div class="masthead-text">
      <h1>${heading}</h1>
    </div>
    <nav class="masthead-nav">
${nav}      <button type="button" id="theme.toggle" class="theme-toggle" onclick="toggleTheme()"
              title="Switch to dark theme" aria-label="Switch to dark theme">
        <svg class="icon-moon" viewBox="0 0 20 20" width="18" height="18" aria-hidden="true">
          <path fill="currentColor" d="M16.3 11.9A6.8 6.8 0 0 1 8.1 3.7a7.2 7.2 0 1 0 8.2 8.2z"/>
        </svg>
        <svg class="icon-sun" viewBox="0 0 20 20" width="18" height="18" aria-hidden="true">
          <circle cx="10" cy="10" r="3.6" fill="currentColor"/>
          <g stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
            <path d="M10 1.6v2.1M10 16.3v2.1M1.6 10h2.1M16.3 10h2.1"/>
            <path d="M4.1 4.1l1.5 1.5M14.4 14.4l1.5 1.5M15.9 4.1l-1.5 1.5M5.6 14.4l-1.5 1.5"/>
          </g>
        </svg>
      </button>
    </nav>
  </div>
</header>
"""
  }
}

// filter that can be used with the "copy" task of Gradle that transforms Markdown files
// from source location to HTML (adding HTML header, styling,...)
class MarkdownFilter extends FilterReader {

  /** Set by the copy spec; see ContentFilterable.filter(Map, Class). */
  File logoFile
  String heading = 'Documentation'
  /** <title> for the page; defaults to its first heading. */
  String pageTitle = null
  Map<String, String> navLinks = [:]

  private final Reader source
  private Reader converted

  MarkdownFilter(Reader reader) throws IOException {
    // Conversion is deferred to the first read so the properties above, which
    // Gradle sets after construction, are in place by the time they are used.
    super(reader)
    this.source = reader
  }

  private Reader delegate() {
    if (converted == null) {
      converted = new StringReader(convert(source.text, logoFile, heading, navLinks, pageTitle))
    }
    return converted
  }

  @Override
  int read() throws IOException {
    return delegate().read()
  }

  @Override
  int read(char[] cbuf, int off, int len) throws IOException {
    return delegate().read(cbuf, off, len)
  }

  @Override
  boolean ready() throws IOException {
    return delegate().ready()
  }

  @Override
  void close() throws IOException {
    source.close()
  }

  public static String convert(String markdownSource, File logoFile, String heading,
                               Map<String, String> navLinks, String pageTitle = null) {
    // first replace LUCENE and SOLR issue numbers with a markdown link
    markdownSource = markdownSource.replaceAll(/(?s)\b(LUCENE|SOLR)\-\d+\b/,
        '[$0](https://issues.apache.org/jira/browse/$0)');

    // convert the markdown
    MutableDataSet options = new MutableDataSet();
    options.setFrom(ParserEmulationProfile.MARKDOWN);
    options.set(Parser.EXTENSIONS,
        [AbbreviationExtension.create(), AutolinkExtension.create(), AttributesExtension.create()]);
    options.set(HtmlRenderer.RENDER_HEADER_ID, true);
    options.set(HtmlRenderer.MAX_TRAILING_BLANK_LINES, 0);
    Document parsed = Parser.builder(options).build().parse(markdownSource);

    StringBuilder html = new StringBuilder('<!DOCTYPE html>\n<html lang="en">\n<head>\n');
    html.append('<meta charset="UTF-8">\n');
    html.append('<meta name="viewport" content="width=device-width, initial-scale=1">\n');
    CharSequence title = pageTitle ?: parsed.getFirstChildAny(Heading.class)?.getText();
    if (title != null) {
      html.append('<title>').append(Escaping.escapeHtml(title, false)).append('</title>\n');
    }
    html.append('<link rel="stylesheet" href="solr-docs.css">\n')
        .append(SolrDocsPage.themeScript()).append('\n')
        .append('</head>\n<body>\n')
        .append(SolrDocsPage.masthead(SolrDocsPage.inlineLogo(logoFile), heading, navLinks))
        .append('\n<main class="page prose">\n');
    HtmlRenderer.builder(options).build().render(parsed, html);
    html.append('</main>\n</body>\n</html>\n');
    return html;
  }
}

// Applies a binding of variables using a template and
// produces Markdown, which is converted to HTML
class MarkdownTemplateTask extends DefaultTask {

  @Internal
  Project productProject = project.parent

  @InputFile
  File templateFile

  @InputFile
  File logoFile

  @Input
  String heading

  @Input
  @Optional
  String pageTitle

  @Input
  Map<String, String> navLinks = [:]

  @OutputFile
  File outputFile

  @Input
  @Optional
  final MapProperty<String, Object> binding = project.objects.mapProperty(String, Object)

  /** adds a property "projectList" containing all subprojects with javadocs as markdown bullet list */
  void withProjectList() {
    binding.put('projectList', project.providers.provider {
      def projects = productProject
          .subprojects.findAll {it.tasks.findByName('renderSiteJavadoc')?.enabled}
          .sort(false, Comparator.comparing {(it.name != 'core') as Boolean}
              .thenComparing(Comparator.comparing {(!it.name.startsWith('solrj')) as Boolean})
              .thenComparing(Comparator.comparing {(it.name == 'test-framework') as Boolean})
              .thenComparing(Comparator.comparing {it.path}));
      return projects.collect {project ->
        def text = "**[${project.relativeDocPath.replace('/', '-')}](${project.relativeDocPath}/index.html):** ${project.description}"
        if (project.name == 'core') {
          text = text.concat(' {style="font-size:larger; margin-bottom:.5em"}')
        }
        return '* ' + text;
      }.join('\n')
    })
  }

  @TaskAction
  void transform() {
    def engine = new SimpleTemplateEngine();
    def resolvedBinding = binding.get() + [
        project: project
    ]
    String markdown = templateFile.withReader('UTF-8') {
      engine.createTemplate(it).make(resolvedBinding).toString();
    }
    outputFile.getParentFile().mkdirs();
    outputFile.write(
        MarkdownFilter.convert(markdown, logoFile, heading, navLinks, pageTitle), 'UTF-8');
  }
}
