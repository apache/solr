def resources = scriptResources(buildscript)

configure(project(':solr:documentation')) {
  // Renders into a private directory so this step has an output of its own and can be cached.
  // Interpreter selection lives in gradle/python.gradle.
  task renderChangesHtml(type: buildinfra.pythonExecTaskClass()) {
    group = 'documentation'
    description = "Renders CHANGELOG.md into Changes.html"

    def changesFile = rootProject.file('CHANGELOG.md')
    def outDir = layout.buildDirectory.dir('changes-html')

    script = file("${resources}/changes2html.py")
    scriptInputs.from(changesFile)
    outputDir = outDir
    scriptArgs.add(changesFile.absolutePath)
    scriptArgs.add(outDir.map {it.file('Changes.html').asFile.absolutePath})
    failureMessage = "Changes.html generation failed"
  }

  task changesToHtml(type: Sync) {
    group = 'documentation'
    description = "Assembles the rendered Changes.html and its stylesheets"

    from renderChangesHtml
    from(resources) {
      include "*.css"
    }
    into providers.provider {file("${project.docroot}/changes")}
  }

  // Make the rendered HTML of changes available as a separate
  // artifact for the distribution.
  configurations {
    changesHtml
  }

  artifacts {
    changesHtml changesToHtml.destinationDir, {
      builtBy changesToHtml
    }
  }
}
