import groovy.json.JsonOutput
import groovy.json.JsonSlurper

// Javadoc renders each module as a self-contained tree whose search only covers
// that module. This merges every tree's search index into one published at the
// documentation root, so javadocs.html searches the whole API and so does the
// search box on each individual page.

configure(project(':solr:documentation')) {
  task unifiedJavadocSearch(type: UnifiedJavadocSearchTask) {
    dependsOn project.parent.subprojects.collect {prj ->
      prj.tasks.matching {it.name == 'renderSiteJavadoc'}
    }
    docroot = project.docroot

    // Writes into another task's output directory, so there is no input/output
    // pair Gradle can fingerprint. It only adds files at the documentation root
    // and never touches the javadoc trees, which must stay byte-identical or
    // every renderSiteJavadoc task would be dirty on the next build.
    outputs.upToDateWhen {false}
  }
}

abstract class UnifiedJavadocSearchTask extends DefaultTask {

  /** The five index files javadoc generates, and the search category of each. */
  private static final List<List<String>> INDEXES = [
      ['module-search-index.js', 'moduleSearchIndex', 'modules'],
      ['package-search-index.js', 'packageSearchIndex', 'packages'],
      ['type-search-index.js', 'typeSearchIndex', 'types'],
      ['member-search-index.js', 'memberSearchIndex', 'members'],
      ['tag-search-index.js', 'tagSearchIndex', 'searchTags'],
  ]

  /**
   * Javadoc's search engine, copied beside the merged index. Its own
   * stylesheet is deliberately left behind: javadocs.html is a documentation
   * site page styled by solr-docs.css, not a javadoc page.
   */
  private static final List<String> ASSETS = ['script.js', 'search.js', 'search-page.js', 'link.svg']

  @Internal
  File docroot

  /** Mirror of getURL() in javadoc's search.js, minus the module prefix. */
  static String entryUrl(Map item, String category) {
    def pkg = item.p ? item.p.replace('.', '/') + '/' : ''
    switch (category) {
      case 'modules':
        return item.l + '/module-summary.html'
      case 'packages':
        return item.u ?: item.l.replace('.', '/') + '/package-summary.html'
      case 'types':
        return item.u ?: pkg + item.l + '.html'
      case 'members':
        return pkg + item.c + '.html#' + (item.u ?: item.l)
      case 'searchTags':
        return item.u
      default:
        throw new GradleException("unknown search category ${category}")
    }
  }

  static List readIndex(File file, String varName) {
    def matcher = (file.getText('UTF-8') =~ /(?s)=\s*(\[.*\])\s*;/)
    return matcher ? new JsonSlurper().parseText(matcher[0][1]) : []
  }

  @TaskAction
  void mergeSearchIndexes() {
    def trees = project.fileTree(docroot) {include '**/type-search-index.js'}
        .files.collect {it.parentFile}
        .findAll {it != docroot}
        .sort {it.path}
    if (trees.isEmpty()) {
      throw new GradleException("No javadoc trees found under ${docroot}")
    }

    def merged = INDEXES.collectEntries {[(it[1]): []]}
    trees.each {tree ->
      def prefix = docroot.toPath().relativize(tree.toPath()).toString().replace(File.separator, '/') + '/'
      INDEXES.each {filename, varName, category ->
        def file = new File(tree, filename)
        if (!file.exists()) {
          return
        }
        UnifiedJavadocSearchTask.readIndex(file, varName).each {item ->
          // javadoc synthesises these per tree; merged they would be one
          // identical-looking row per module.
          if (item.l in ['All Packages', 'All Classes and Interfaces']) {
            return
          }
          // A precomputed url short-circuits getURL() in javadoc's search.js,
          // which is what lets an unmodified search engine resolve a hit in
          // another module.
          item.url = prefix + UnifiedJavadocSearchTask.entryUrl(item, category)
          if (category == 'packages') {
            // The only category whose result label shows item.m.
            item.m = prefix[0..-2]
          }
          merged[varName] << item
        }
      }
    }

    INDEXES.each {filename, varName, category ->
      // The trailing call is how javadoc's search page learns an index
      // finished loading; it stays on "Loading..." without one.
      new File(docroot, filename).setText(
          "${varName} = ${JsonOutput.toJson(merged[varName])};updateSearchResults();\n", 'UTF-8')
      logger.lifecycle("${filename}: ${merged[varName].size()} entries")
    }

    def source = trees.first()
    ASSETS.each {asset ->
      def file = new File(source, asset)
      if (file.exists()) {
        project.copy {
          from file
          into docroot
        }
      }
    }
    project.copy {
      from new File(source, 'script-dir')
      into new File(docroot, 'script-dir')
    }

    // The copied script.js carries the bar config of whichever tree it came
    // from; at the documentation root there is nothing to climb and no module
    // to preselect.
    def rootScript = new File(docroot, 'script.js')
    rootScript.setText(rootScript.getText('UTF-8')
        .replaceFirst(/var solrDocsRootUp = "[^"]*";/, 'var solrDocsRootUp = "";')
        .replaceFirst(/var solrDocsModule = "[^"]*";/, 'var solrDocsModule = "";'), 'UTF-8')

    logger.lifecycle("Merged ${trees.size()} javadoc trees into a site-wide search index")
  }
}
