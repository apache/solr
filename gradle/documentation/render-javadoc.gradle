// Fix for Java 11 Javadoc tool that cannot handle split packages between modules correctly.
// (by removing all the packages which are part of lucene-core)
// See: https://issues.apache.org/jira/browse/LUCENE-8738?focusedCommentId=16818106&page=com.atlassian.jira.plugin.system.issuetabpanels:comment-tabpanel#comment-16818106

// Disable Javadoc rendering for these projects.
configure(subprojects.findAll {
  it.path in [
      ':platform',
      ':solr:solr-ref-guide',
      ':solr:server',
      ':solr:webapp']
}) {
  project.tasks.withType(RenderJavadocTask) {
    enabled = false
  }
}

// Add cross-project documentation task dependencies:
// - each RenderJavaDocs task gets a dependency to all tasks with same name in its dependencies
// - the dependency is using dependsOn with a closure to enable lazy evaluation
configure(subprojects) {
  project.tasks.withType(RenderJavadocTask) {task ->
    task.dependsOn {
      task
          .project
          .configurations.implementation.allDependencies.withType(ProjectDependency).collect {dep ->
        def otherProject = task.project.project(dep.path)
        return otherProject.tasks.findByName(task.name)
      }.findAll {
        // Do not depend on disabled tasks or tasks that do not exist
        // :platform module does not have a renderJavaDoc and therefore task is null
        it?.enabled == true
      }
    }
  }
}

class OfflineLink implements Serializable {
  @Input
  String url

  @InputDirectory
  @PathSensitive(PathSensitivity.RELATIVE)
  @IgnoreEmptyDirectories
  File location

  OfflineLink(String url, File location) {
    this.url = url
    this.location = location
  }
}

@CacheableTask
class RenderJavadocTask extends DefaultTask {
  @InputFiles
  @PathSensitive(PathSensitivity.RELATIVE)
  @IgnoreEmptyDirectories
  @SkipWhenEmpty
  SourceDirectorySet srcDirSet;

  @OutputDirectory
  File outputDir

  @CompileClasspath
  FileCollection classpath

  @CompileClasspath
  FileCollection docletpath

  @Input
  String title

  @Input
  boolean linksource = false

  @Input
  boolean enableSearch = false

  @Input
  boolean relativeProjectLinks = false

  @Input
  JavaVersion releaseVersion

  @Internal
  Map<String, File> offlineLinks = [:]

  // Computes cacheable inputs from the map in offlineLinks.
  @Nested
  List<OfflineLink> getCacheableOfflineLinks() {
    return offlineLinks.collect {url, location -> new OfflineLink(url, location)}
  }

  @Input
  @Optional
  final Property<String> solrDocUrl = project.objects.property(String)

  // default is to require full javadocs
  @Input
  String javadocMissingLevel = "parameter"

  // anything in these packages is checked with level=method. This allows iteratively fixing one package at a time.
  @Input
  List<String> javadocMissingMethod = []

  // default is not to ignore any elements, should only be used to workaround split packages
  @Input
  List<String> javadocMissingIgnore = []

  @Input
  @Optional
  ListProperty<String> extraOpts = project.objects.listProperty(String)

  @Optional
  @Input
  final Property<String> executable = project.objects.property(String).convention(
      project.provider {Jvm.current().javadocExecutable.toString()})

  /**
   * Relative path from the root of this javadoc tree up to the documentation
   * root, e.g. '../' for :solr:core. Empty means the rendered javadocs do not
   * sit under a documentation root, and no Solr bar is injected.
   */
  @Input
  String docsRootPrefix = ''

  /**
   * The unified javadoc tree, for the one -link/-linkoffline a tree still needs.
   * Null for the tree that is itself the unified one.
   */
  @Internal
  File unifiedJavadocDir

  /**
   * Whether the site's Javadocs page indexes this tree. Only then may its
   * search links hand off to that page; a tree it does not index has to keep
   * its own, or the reader's results would silently lose that tree.
   */
  @Input
  boolean sitewideSearch = false

  @InputDirectory
  @PathSensitive(PathSensitivity.RELATIVE)
  @IgnoreEmptyDirectories
  File taskResources

  @TaskAction
  public void render() {
    def srcDirs = srcDirSet.srcDirs.findAll {dir -> dir.exists()}
    def optionsFile = project.file("${getTemporaryDir()}/javadoc-options.txt")

    // create the directory, so relative link calculation knows that it's a directory:
    project.delete(outputDir);
    outputDir.mkdirs();

    def opts = []
    opts << ['-overview', project.file("${srcDirs[0]}/overview.html")]
    opts << ['-sourcepath', srcDirs.join(File.pathSeparator)]
    opts << ['-subpackages', 'org.apache.solr']
    opts << ['-d', outputDir]
    opts << '-protected'
    opts << ['-encoding', 'UTF-8']
    opts << ['-charset', 'UTF-8']
    opts << ['-docencoding', 'UTF-8']
    if (!enableSearch) {
      opts << '-noindex'
    }
    opts << '-author'
    opts << '-version'
    if (linksource) {
      opts << '-linksource'
    }
    opts << '-use'
    opts << ['-locale', 'en_US']
    opts << ['-windowtitle', title]
    opts << ['-doctitle', title]
    if (!classpath.isEmpty()) {
      opts << ['-classpath', classpath.asPath]
    }
    opts << [
        '-bottom', "<i>Copyright &copy; 2000-${project.buildYear} Apache Software Foundation. All Rights Reserved.</i>"
    ]
    opts << [
        '-tag', 'lucene.experimental:a:WARNING: This API is experimental and might change in incompatible ways in the next release.'
    ]
    opts << [
        '-tag', 'lucene.internal:a:NOTE: This API is for internal purposes only and might change in incompatible ways in the next release.'
    ]
    opts << [
        '-tag',
        "lucene.spi:t:SPI Name (case-insensitive: if the name is 'htmlStrip', 'htmlstrip' can be used when looking up the service)."
    ]

    opts << ['-doclet', "org.apache.lucene.missingdoclet.MissingDoclet"]
    opts << ['-docletpath', docletpath.asPath]
    opts << ['--missing-level', javadocMissingLevel]
    if (javadocMissingIgnore) {
      opts << ['--missing-ignore', String.join(',', javadocMissingIgnore)]
    }
    if (javadocMissingMethod) {
      opts << ['--missing-method', String.join(',', javadocMissingMethod)]
    }

    opts << ['-quiet']

    // Add all extra options, if any.
    opts.addAll(extraOpts.orElse([]).get())

    def allOfflineLinks = [:]
    allOfflineLinks.putAll(offlineLinks)

    // Every Solr class now lives in one tree, so a module never has to link to
    // a sibling. Only the per-module renderJavadoc output, which is what the
    // Maven javadoc jars package, still needs a pointer at the published tree.
    if (!relativeProjectLinks) {
      def value = solrDocUrl.getOrElse(null)
      if (value && unifiedJavadocDir) {
        allOfflineLinks.put("${value}/${UNIFIED_DOC_PATH}/".toString(), unifiedJavadocDir)
      }
    } else if (unifiedJavadocDir) {
      def relative = outputDir.toPath().toAbsolutePath()
          .relativize(unifiedJavadocDir.toPath().toAbsolutePath()).toString()
          .replace(File.separator, '/')

      // This tree and the unified one share packages (SOLR-15604), and a plain
      // -link would send references to a shared package to the other tree even
      // when the target is defined right here. Link against a copy of the
      // element list with those packages removed, so they resolve locally.
      def ourPackages = srcDirSet.srcDirs.collectMany {root ->
        !root.exists() ? [] : project.fileTree(root) {include '**/*.java'}.files.collect {
          root.toPath().relativize(it.toPath().parent).toString().replace(File.separator, '.')
        }
      } as Set
      def elementList = new File(unifiedJavadocDir, 'element-list')
      def linkDir = project.file("${getTemporaryDir()}/unified-element-list")
      project.mkdir linkDir
      new File(linkDir, 'element-list').setText(
          elementList.readLines().findAll {!ourPackages.contains(it.trim())}.join('\n') + '\n',
          'UTF-8')
      allOfflineLinks.put(relative, linkDir)
    }

    // Add offline links.
    allOfflineLinks.each {url, dir ->
      // Some sanity check/validation here to ensure dir/package-list or dir/element-list is
      // present.
      if (!project.file("$dir/package-list").exists() &&
          !project.file("$dir/element-list").exists()) {
        throw new GradleException("Expected pre-rendered package-list or element-list at ${dir}.")
      }
      opts << ['-linkoffline', url, dir]
    }

    opts << ['--release', releaseVersion.toString()]
    opts << '-Xdoclint:all,-missing'

    // Increase Javadoc's heap.
    opts += ["-J-Xmx512m"]
    // Force locale to be "en_US" (fix for: https://bugs.openjdk.java.net/browse/JDK-8222793)
    opts += ["-J-Duser.language=en", "-J-Duser.country=US"]

    // -J options have to be passed on command line, they are not interpreted if passed via args file.
    def jOpts = opts.findAll {opt -> opt instanceof String && opt.startsWith("-J")}
    opts.removeAll(jOpts)

    // Temporary file that holds all javadoc options for the current task (except jOpts)
    optionsFile.withWriter("UTF-8", {writer ->
      // escapes an option with single quotes or whitespace to be passed in the options.txt file for
      def escapeJavadocOption = {String s -> (s =~ /[ '"]/) ? ("'" + s.replaceAll(/[\\'"]/, /\\$0/) + "'") : s}

      opts.each {entry ->
        if (entry instanceof List) {
          writer.write(entry.collect {escapeJavadocOption(it as String)}.join(" "))
        } else {
          writer.write(escapeJavadocOption(entry as String))
        }
        writer.write('\n')
      }
    })

    def javadocCmd = project.file(executable.get())
    logger.info("Javadoc executable used: ${javadocCmd}")

    project.quietExec {
      executable javadocCmd

      args += ["@${optionsFile}"]
      args += jOpts
    }

    // append some special table css, prettify css
    ant.concat(
        destfile: "${outputDir}/stylesheet.css",
        append: "true",
        fixlastline: "true",
        encoding: "UTF-8") {
      filelist(dir: taskResources, files: "table_padding.css")
      filelist(dir: project.file("${taskResources}/prettify"), files: "prettify.css")
    }

    // append prettify to scripts
    ant.concat(
        destfile: "${outputDir}/script.js",
        append: "true",
        fixlastline: "true",
        encoding: "UTF-8") {
      filelist(dir: project.file("${taskResources}/prettify"),
          files: "prettify.min.js inject-javadocs.js")
    }

    // Give every page the Solr bar, by extending the stylesheet and script that
    // javadoc already links from each one.
    if (!docsRootPrefix.isEmpty()) {
      project.file("${outputDir}/stylesheet.css") << '\n' +
          project.file("${taskResources}/solr-javadoc-theme.css").getText('UTF-8')

      // The site's Javadocs page searches this tree, so send the "Go to search
      // page" link there. search.js builds it as pathtoroot + the literal, and
      // pathtoroot reaches this tree's root, so climb to the documentation root.
      def searchScript = project.file("${outputDir}/search.js")
      if (sitewideSearch && searchScript.exists()) {
        searchScript.setText(searchScript.getText('UTF-8')
            .replace('"search.html?q="', '"' + docsRootPrefix + 'javadocs.html?q="'), 'UTF-8')
      }
      def barConfig = [
          'var solrDocsRootUp = ' + groovy.json.JsonOutput.toJson(docsRootPrefix) + ';',
          'var solrDocsSitewideSearch = ' + sitewideSearch + ';'
      ].join('\n')
      project.file("${outputDir}/script.js") << '\n' + barConfig + '\n' +
          project.file("${taskResources}/solr-javadoc-bar.js").getText('UTF-8')
    }

    ant.fixcrlf(
        srcdir: outputDir,
        includes: "stylesheet.css script.js",
        eol: "lf",
        fixlast: "true",
        encoding: "UTF-8")
  }
}

// The documentation site is rendered as two javadoc trees rather than one per
// module: a unified tree holding every public package, and test-framework,
// which shares a dozen packages with core and would otherwise put test
// utilities on the public API pages.
//
// Both are hosted on projects that already have the Java plugin, the
// missing-doclet configuration and minJavaVersion that RenderJavadocTask needs.

// Settings shared by both published trees. Each sits two directories below the
// documentation root, hence the fixed docsRootPrefix.
def siteJavadocDefaults = {RenderJavadocTask task ->
  task.group = "documentation"
  task.taskResources = resources
  task.releaseVersion = task.project.minJavaVersion
  task.enableSearch = true
  task.docsRootPrefix = '../../'
}

configure(project(':solr:core')) {
  // Deferred: the missing-doclet configuration this task type needs is itself
  // created under plugins.withType(JavaPlugin), after the root script runs.
  plugins.withType(JavaPlugin) {
    task renderSiteJavadoc(type: RenderJavadocTask) {
      description "Generates the unified Javadoc API documentation for the site."
      siteJavadocDefaults(delegate)

      outputDir = project.docroot.toPath().resolve(UNIFIED_DOC_PATH).toFile()
      sitewideSearch = true

      // One run means one doclet configuration, so every split package that any
      // module used to excuse individually has to be excused here. Removing
      // these is SOLR-15604.
      javadocMissingIgnore = [
          "org.apache.solr.schema",
          "org.apache.solr.update.processor",
          "org.apache.solr.common",
          "org.apache.solr.common.cloud",
          "org.apache.solr.client.solrj.cloud",
          "org.apache.solr.client.solrj.embedded",
          "org.apache.solr.client.solrj.impl"
      ]
    }
  }
}

configure(project(':solr:test-framework')) {
  plugins.withType(JavaPlugin) {
    task renderSiteJavadoc(type: RenderJavadocTask) {
      description "Generates the test-framework Javadoc API documentation for the site."
      siteJavadocDefaults(delegate)

      dependsOn sourceSets.main.compileClasspath
      classpath = sourceSets.main.compileClasspath
      srcDirSet = sourceSets.main.java
      relativeProjectLinks = true
      outputDir = project.docroot.toPath().resolve(TEST_FRAMEWORK_DOC_PATH).toFile()
      unifiedJavadocDir = project.docroot.toPath().resolve(UNIFIED_DOC_PATH).toFile()
    }
  }
}

// The unified tree's sources are every module's but test-framework's, which can
// only be collected once the subprojects have been evaluated.
gradle.projectsEvaluated {
  def host = project(':solr:core')
  def modules = project(':solr').subprojects.findAll {
    it.plugins.hasPlugin(JavaPlugin) &&
        it.tasks.findByName('renderJavadoc')?.enabled &&
        it.path != ':solr:test-framework'
  }

  def sources = host.objects.sourceDirectorySet('unifiedJavadoc', 'All Solr module sources')
  modules.each {mod -> mod.sourceSets.main.java.srcDirs.each {sources.srcDir(it)}}

  host.tasks.renderSiteJavadoc.configure {
    srcDirSet = sources
    classpath = host.files(modules.collect {it.sourceSets.main.compileClasspath})
    dependsOn modules.collect {it.tasks.named('compileJava')}
    title = "Solr ${host.version} API"
  }

  // The per-module renderJavadoc output is what the Maven javadoc jars package;
  // point its external links at the unified tree.
  project(':solr').subprojects.each {prj ->
    prj.tasks.matching {it.name == 'renderJavadoc'}.configureEach {
      unifiedJavadocDir = host.tasks.renderSiteJavadoc.outputDir
    }
  }
}
