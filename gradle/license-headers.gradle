// Adds the ASF license header to new Java files that lack one.
// Apache RAT (gradlew rat) enforces headers but cannot fix them.
tasks.register("addLicenseHeaders") {
  group = "verification"
  description = "Prepends the ASF license header to Java files added on this branch (vs. main) or untracked, if missing."

  doLast {
    def header = file("gradle/validation/spotless/asl-header.txt").getText('UTF-8')
    def gitLines = { List<String> cmd ->
      try {
        def proc = cmd.execute(null, rootDir)
        def out = proc.text
        if (proc.waitFor() != 0) {
          logger.warn("addLicenseHeaders: '${cmd.join(' ')}' failed; skipping")
          return []
        }
        return out.readLines()
      } catch (Exception e) {
        logger.warn("addLicenseHeaders: failed with error (${e.message}); skipping")
        return []
      }
    }

    def candidates = gitLines(['git', 'diff', '--name-only', '--diff-filter=A', 'main...HEAD']) +
        gitLines(['git', 'diff', '--name-only', '--diff-filter=A', 'HEAD']) +
        gitLines(['git', 'ls-files', '--others', '--exclude-standard'])

    candidates.unique().findAll { it.endsWith('.java') }.each { path ->
      def f = new File(rootDir, path)
      if (f.exists()) {
        def content = f.getText('UTF-8')
        if (content.contains('Licensed to the Apache Software Foundation')) {
          return
        }
        f.write(header + content, 'UTF-8')
        logger.lifecycle("Added license header: ${path}")
      }
    }
  }
}

// Run as part of the top level `./gradlew tidy`
rootProject.tasks.named("tidy").configure {
  dependsOn "addLicenseHeaders"
}
