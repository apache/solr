configure(rootProject) {
  task checkBrokenLinks {
    group 'Verification'
    description 'Check broken links in the entire documentation'

    dependsOn ':solr:documentation:checkBrokenLinks'
  }
}

configure(project(':solr:documentation')) {
  task checkBrokenLinks(type: buildinfra.pythonExecTaskClass(), 'dependsOn': 'documentation') {
    group 'Verification'
    description 'Check broken links in the entire documentation'

    script = rootProject.file("dev-tools/scripts/checkJavadocLinks.py")
    // Wrapped in a provider so as to lazily evaluate the 'docroot' property
    // (see gradle/documentation/documentation.gradle).
    scriptInputs.from(providers.provider {project.docroot})
    scriptArgs.add(providers.provider {project.docroot.absolutePath})
    logFile = layout.buildDirectory.file('check-broken-links-output.txt')
    failureMessage = "Broken links check failed"
  }

  check.dependsOn checkBrokenLinks
}
